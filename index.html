function addFile(name, code="", extra={}) {
  const finalName = cleanProjectFilename(name, `script${projectFiles.length + 1}.crim`);
  if (projectFiles.some(f => f.name.toLowerCase() === finalName.toLowerCase())) { showToast("A file with that name already exists"); return; }
  const file = { id: "file_" + Date.now() + "_" + Math.random().toString(36).slice(2,7), name: finalName, code, language: CrimIDE.detect(finalName), ...extra };
  projectFiles.push(file); switchFile(file.id); showToast(`Added ${finalName}`);
}
function renameFile(id) {
  const file = projectFiles.find(f => f.id === id); if (!file) return;
  const value = prompt("Rename file (you can change its extension too)", file.name); if (value === null) return;
  const name = cleanProjectFilename(value, file.name);
  if (projectFiles.some(f => f.id !== id && f.name.toLowerCase() === name.toLowerCase())) { showToast("That filename is already in use"); return; }
  file.name = name; file.language = CrimIDE.detect(name); renderFileTabs(); if (id === activeFileId) switchFile(id); scheduleAutosave(); showToast(`Renamed to ${name}`);
}
function closeFile(id) {
  if (projectFiles.length <= 1) { showToast("A project needs at least one file"); return; }
  const index = projectFiles.findIndex(f => f.id === id); if (index < 0) return;
  projectFiles.splice(index, 1);
  if (activeFileId === id) { const next = projectFiles[Math.max(0, index - 1)]; activeFileId = next.id; editor.value = next.code; updateLineNumbers(); updateCursorPos(); }
  if (runEntryFileId === id) runEntryFileId = activeFileId;
  renderFileTabs(); scheduleAutosave();
}
function scheduleAutosave() {
  const status = document.getElementById("save-status"); if (!status) return;
  status.textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const current = activeFile(); if (current && current.kind !== "image") current.code = editor.value;
      localStorage.setItem(PROJECT_STORAGE_KEY, JSON.stringify({ version: 3, files: projectFiles, activeFileId, runEntryFileId, cStandard, theme: currentTheme, editorSettings }));
      status.textContent = "Saved locally";
      dirtyFileIds.clear(); renderFileTabs();
    } catch (err) { status.textContent = "Autosave unavailable"; }
  }, 350);
}
function restoreProject() {
  try {
    const raw = localStorage.getItem(PROJECT_STORAGE_KEY); if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.files) || !data.files.length) return false;
    projectFiles = data.files.filter(f => f && typeof f.name === "string" && typeof f.id === "string" && (typeof f.code === "string" || (f.kind === "image" && typeof f.dataUrl === "string"))).map(f => ({ ...f, language: f.language || CrimIDE.detect(f.name) }));
    if (!projectFiles.length) return false;
    activeFileId = projectFiles.some(f => f.id === data.activeFileId) ? data.activeFileId : projectFiles[0].id;
    runEntryFileId = projectFiles.some(f => f.id === data.runEntryFileId) ? data.runEntryFileId : activeFileId;
    cStandard = ["c11","c17","c23"].includes(data.cStandard) ? data.cStandard : "c11";
    editorSettings = {...editorSettings, ...(data.editorSettings || {})};
    document.getElementById("c-standard-select").value = cStandard;
    if (data.theme === "light") setTheme("light"); else setTheme("dark");
    editor.value = activeFile().code || ""; renderFileTabs(); switchFile(activeFileId);
    document.getElementById("save-status").textContent = "Restored local project";
    return true;
  } catch (_) { return false; }
}

// ROSE package loading: Crim+ source packages are parsed by the same browser interpreter.
// Python/CrimCobra packages receive safe browser-native adapters where browser APIs permit it.
const rosePackageCache = new Map();
async function fetchRosePackage(name) {
  if (rosePackageCache.has(name)) return rosePackageCache.get(name);
  const registryResponse = await fetch(ROSE_REGISTRY_URL, { cache: "no-cache" });
  if (!registryResponse.ok) throw new Error(`Could not load the ROSE registry (${registryResponse.status})`);
  const registry = await registryResponse.json();
  const entry = registry?.packages?.[name];
  if (!entry?.url) throw new Error(`'${name}' is not in the current ROSE registry`);
  const response = await fetch(entry.url, { cache: "no-cache" });
  if (!response.ok) throw new Error(`Could not download ROSE module '${name}' (${response.status})`);
  const pkg = await response.json();
  if (pkg.name !== name || !Array.isArray(pkg.files) || !Array.isArray(pkg.python || [])) throw new Error(`The '${name}' package has an invalid ROSE manifest`);
  rosePackageCache.set(name, pkg);
  return pkg;
}
function getRequestedModules(source) {
  const found = new Set();
  for (const line of source.split(/\r?\n/)) {
    const m = line.trim().match(/^(?:use|this script uses:)\s+([\w,\s]+)$/i);
    if (m) m[1].split(/\s*(?:,\s*and\s+|,|\s+and\s+)\s*/).forEach(x => { if (x.trim()) found.add(x.trim().toLowerCase()); });
  }
  return [...found].filter(x => !["time", "display", "sound", "random", "tilemap"].includes(x));
}
async function loadRoseModuleStatements(source) {
  const names = getRequestedModules(source);
  const statements = [];
  for (const name of names) {
    const pkg = await fetchRosePackage(name);
    const crimFiles = ["csv", "runner"].includes(name) ? [] : (pkg.files || []).filter(f => typeof f.source === "string" && /\.crim$/i.test(f.name || ""));
    if (crimFiles.length) {
      for (const file of crimFiles) {
        try { statements.push(...parseProgram(loadLines(file.source))); }
        catch (err) { throw new Error(`ROSE module '${name}' could not be compiled for Studio: ${err.message}`); }
      }
    } else if (!(pkg.python || []).length) {
      throw new Error(`ROSE module '${name}' contains no browser-loadable source`);
    }
  }
  return statements;
}

function createBrowserModuleFunctions(runtime) {
  const csv = { rows: [], error: "" };
  const virtualFiles = () => projectFiles.map(f => f.name);
  const pathName = value => String(value ?? "").replace(/\\/g, "/").replace(/^\.\//, "");
  const fns = {
    // mathtools browser-native helpers (also available when the package source is refreshed).
    pi: () => Math.PI,
    square: n => Number(n) ** 2,
    cube: n => Number(n) ** 3,
    sign: n => Math.sign(Number(n)),
    clamp: (v, lo, hi) => Math.min(Number(hi), Math.max(Number(lo), Number(v))),
    lerp: (a, b, t) => Number(a) + (Number(b) - Number(a)) * Number(t),
    map_range: (v, a, b, c, d) => Number(b) === Number(a) ? Number(c) : Number(c) + (Number(v) - Number(a)) * (Number(d) - Number(c)) / (Number(b) - Number(a)),
    percent: (p, w) => Number(w) === 0 ? 0 : Number(p) / Number(w) * 100,
    hypot: (a, b) => Math.hypot(Number(a), Number(b)),
    distance: (x1, y1, x2, y2) => Math.hypot(Number(x2)-Number(x1), Number(y2)-Number(y1)),
    to_radians: d => Number(d) * Math.PI / 180,
    to_degrees: r => Number(r) * 180 / Math.PI,
    is_even: n => Number(n) % 2 === 0 ? 1 : 0,
    is_odd: n => Math.abs(Number(n) % 2) === 1 ? 1 : 0,
    gcd: (a, b) => { a=Math.abs(Math.trunc(a)); b=Math.abs(Math.trunc(b)); while(b){const t=a%b;a=b;b=t;} return a; },
    lcm: (a, b) => !Number(a)||!Number(b) ? 0 : Math.abs(Number(a)*Number(b))/fns.gcd(a,b),
    factorial: n => { n=Math.trunc(Number(n)); if(n<0||n>170) throw new Error("factorial supports integers from 0 to 170 in the browser"); let v=1; for(let i=2;i<=n;i++)v*=i; return v; },
    fibonacci: n => { n=Math.max(0,Math.min(147,Math.trunc(Number(n)))); let a=0,b=1; for(let i=0;i<n;i++) [a,b]=[b,a+b]; return a; },
    is_prime: n => { n=Math.trunc(Number(n)); if(n<2)return 0; for(let i=2;i*i<=n;i++)if(n%i===0)return 0; return 1; },
    // texttools common helpers
    reverse_text: s => [...String(s)].reverse().join(""),
    count_text: (s, part) => String(s).split(String(part)).length - 1,
    replace_text: (s, oldText, newText) => String(s).split(String(oldText)).join(String(newText)),
    repeat_text: (s, n) => String(s).repeat(Math.max(0,Math.min(10000,Math.trunc(Number(n))))),
    // colors helpers
    hex_color: c => { const raw=String(c).trim(); if(/^#[0-9a-f]{6}$/i.test(raw))return raw; const rgb=COLORS[raw.toLowerCase()]; return rgb ? "#"+rgb.map(v=>v.toString(16).padStart(2,"0")).join("") : raw; },
    // JSON helpers
    encode_json: value => JSON.stringify(value),
    decode_json: value => JSON.parse(String(value)),
    // CSV API, matching the published csv package's public instruction names.
    parse_csv: source => { csv.error=""; try { const text=String(source).replace(/\r\n?/g,"\n"); const rows=[]; let row=[], field="", quoted=false; for(let i=0;i<text.length;i++){const ch=text[i]; if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++;}else if(ch==='"')quoted=false;else field+=ch;}else if(ch==='"'&&field==="")quoted=true;else if(ch===","){row.push(field);field="";}else if(ch==="\n"){row.push(field);rows.push(row);row=[];field="";}else field+=ch;} if(quoted)csv.error="Unclosed quoted field"; if(field!==""||row.length||text.endsWith(",")) {row.push(field);rows.push(row);} csv.rows=rows; return rows.length; } catch(e){csv.error=e.message;csv.rows=[];return 0;} },
    get_row_count: () => csv.rows.length,
    get_col_count: () => csv.rows.reduce((m,r)=>Math.max(m,r.length),0),
    get_error: () => csv.error,
    get_cell: (r,c) => csv.rows[Math.trunc(r)]?.[Math.trunc(c)] ?? "",
    get_row: r => (csv.rows[Math.trunc(r)]||[]).map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(","),
    reset_csv: () => {csv.rows=[];csv.error="";return 1;},
    to_csv: () => csv.rows.map((_,i)=>fns.get_row(i)).join("\n"),
    csv_escape_cell: v => {v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;},
    // filetools works only inside the Studio project workspace; it cannot access the user's disk.
    list_files: folder => folder && folder!=="." ? [] : virtualFiles(),
    folder_exists: folder => folder === "." ? 1 : 0,
    file_size: name => {const f=projectFiles.find(x=>x.name===pathName(name)); if(!f)throw new Error(`Cannot find project file '${name}'`);return new Blob([f.code]).size;},
    file_extension: name => {const m=String(name).toLowerCase().match(/\.[^.\/]+$/);return m?m[0]:"";},
    copy_file: (from,to) => {const f=projectFiles.find(x=>x.name===pathName(from));if(!f)throw new Error(`Cannot find project file '${from}'`);if(projectFiles.some(x=>x.name===pathName(to)))throw new Error(`'${to}' already exists`);projectFiles.push({id:"file_"+Date.now()+Math.random(),name:pathName(to),code:f.code});renderFileTabs();scheduleAutosave();return 1;},
    move_file: (from,to) => {const f=projectFiles.find(x=>x.name===pathName(from));if(!f)throw new Error(`Cannot find project file '${from}'`);if(projectFiles.some(x=>x.name===pathName(to)))throw new Error(`'${to}' already exists`);f.name=pathName(to);renderFileTabs();scheduleAutosave();return 1;},
    delete_folder: () => {throw new Error("Studio's virtual workspace does not expose folder deletion");},
    // systemtools browser-safe information
    os_name: () => "Browser",
    python_version: () => "Not available in browser Studio",
    today: () => new Date().toISOString().slice(0,10),
    now: () => new Date().toLocaleTimeString(),
    timestamp: () => Date.now()/1000,
    cpu_count: () => navigator.hardwareConcurrency || 1,
    env_var: name => String(name).toUpperCase()==="USER_AGENT" ? navigator.userAgent : "",
    open_web_page: url => {const u=String(url); if(!/^https?:\/\//i.test(u))return 0; window.open(u,"_blank","noopener,noreferrer"); return 1;},
    beep: () => {try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();const o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+.08);}catch{} return 1;},
    // URL encoding is synchronous; fetch_text/fetch_json are deliberately not faked because fetch is async and CORS-controlled.
    url_encode: value => encodeURIComponent(String(value)),
    // runner executes another project file in an isolated runtime with captured output.
    run_crim: filename => {
      const target = projectFiles.find(f => f.name === pathName(filename));
      runtime.env.crim_output = "";
      runtime.env.crim_error = "";
      if (!target) { runtime.env.crim_error = `Cannot find project file '${filename}'`; return 0; }
      try {
        const child = new CrimRuntime(canvas, uploadedAssets, {
          onSay: value => { runtime.env.crim_output += (runtime.env.crim_output ? "\n" : "") + showVal(value); },
          onAsk: () => { throw new Error("run_crim cannot run scripts that ask for interactive input"); },
          onError: err => { runtime.env.crim_error = err.message; }
        });
        const childProgram = parseProgram(loadLines(target.code));
        child.runBlockSync(childProgram);
        if (runtime.env.crim_error) return 0;
        return 1;
      } catch (err) { runtime.env.crim_error = err.message; return 0; }
    }
  };
  return fns;
}

// Console Helpers
function clearConsole() {
  queuedConsoleInputs = [];
  consoleOutput.innerHTML = "";
  consoleCount = 0;
  consoleBadge.textContent = "0";
  consoleBadge.classList.add("hidden");
}

function appendConsole(text, colorRgb = null, isError = false) {
  if (consoleCount === 0) consoleOutput.innerHTML = "";
  consoleCount++;
  consoleBadge.textContent = String(consoleCount);
  if (viewConsole.classList.contains("hidden")) {
    consoleBadge.classList.remove("hidden");
  }

  const row = document.createElement("div");
  if (isError) {
    row.className = "px-3 py-2 rounded-lg font-semibold border";
    row.style.backgroundColor = "var(--accent-soft)";
    row.style.borderColor = "var(--accent-border)";
    row.style.color = "var(--accent)";
  } else {
    row.className = "leading-relaxed";
    if (colorRgb) row.style.color = `rgb(${colorRgb[0]}, ${colorRgb[1]}, ${colorRgb[2]})`;
  }
  row.textContent = text;
  const lineMatch = isError && String(text).match(/(?:line|:)(?:\\s*)(\\d+)/i);
  if (lineMatch) {
    const line = Number(lineMatch[1]);
    row.title = `Click to jump to line ${line}`;
    row.style.cursor = "pointer";
    row.addEventListener("click", () => jumpToLine(line));
  }
  consoleOutput.appendChild(row);
  consoleOutput.scrollTop = consoleOutput.scrollHeight;
}

function jumpToLine(line) {
  if (!Number.isFinite(line) || line < 1) return;
  if (monacoEditor) {
    monacoEditor.focus();
    monacoEditor.revealLineInCenter(line);
    monacoEditor.setPosition({ lineNumber: line, column: 1 });
    monacoEditor.setSelection(new monaco.Selection(line, 1, line, 1));
  } else {
    editorElement.focus();
    const lines = editor.value.split("\\n");
    const offset = lines.slice(0, line - 1).join("\\n").length + (line > 1 ? 1 : 0);
    editor.selectionStart = editor.selectionEnd = offset;
  }
  showToast(`Jumped to line ${line}`);
}
document.getElementById("btn-clear-console").addEventListener("click", clearConsole);
document.getElementById("btn-copy-console").addEventListener("click", async () => {
  const text = Array.from(consoleOutput.children).map(row => row.textContent).join("\\n");
  try { await navigator.clipboard.writeText(text); showToast("Console copied"); }
  catch (_) { showToast("Clipboard access unavailable"); }
});

function submitConsoleInput() {

  const val = field.value;
  if (!val && !pendingAskResolve) return;
  field.value = "";
  appendConsole(`> ${val}`);
  if (pendingAskResolve) {
    const res = pendingAskResolve;
    pendingAskResolve = null;
    document.getElementById("console-prompt-label").textContent = "›";
    field.placeholder = "Type input here and press Enter when the program asks...";
    res(val);
  } else {
    // Keep input typed ahead of a program's next input() / prompt request.
    queuedConsoleInputs.push(val);
  }
  field.focus();
}

document.getElementById("console-input-submit").addEventListener("click", submitConsoleInput);
document.getElementById("console-input-field").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitConsoleInput();
});

function requestConsoleLine(promptText) {
  switchOutputTab("console");
  appendConsole(promptText, null, false);
  if (queuedConsoleInputs.length) return Promise.resolve(queuedConsoleInputs.shift());
  const field = document.getElementById("console-input-field");
  document.getElementById("console-prompt-label").textContent = "?";
  field.placeholder = "Program is waiting for input...";
  field.focus();
  return new Promise(resolve => { pendingAskResolve = value => {
    document.getElementById("console-prompt-label").textContent = "›";
    field.placeholder = "Type input here and press Enter when the program asks...";
    resolve(value);
  }; });
}

// Images & Audio Assets Grid
function renderAssetsGrid() {
  const grid = document.getElementById("assets-grid");
  grid.innerHTML = "";

  Object.values(uploadedAssets).forEach(asset => {
    const card = document.createElement("div");
    card.className = "sub-bg border rounded-xl p-2.5 flex items-center gap-2.5 group relative transition hover:border-[var(--accent)] cursor-pointer";
    card.title = `Click to copy "${asset.name}"`;

    // Click card to copy quoted filename
    card.addEventListener("click", () => {
      const temp = document.createElement("textarea");
      temp.value = `"${asset.name}"`;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      showToast(`Copied "${asset.name}"`);
    });

    if (asset.type === "image") {
      const img = document.createElement("img");
      img.src = asset.dataUrl;
      img.alt = asset.name;
      img.className = "w-9 h-9 object-contain rounded-md shrink-0";
      card.appendChild(img);
    } else {
      const playIcon = document.createElement("button");
      playIcon.className = "w-9 h-9 rounded-md accent-pill flex items-center justify-center shrink-0 cursor-pointer";
      playIcon.innerHTML = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
      playIcon.title = "Preview audio";
      playIcon.addEventListener("click", (e) => {
        e.stopPropagation();
        new Audio(asset.dataUrl).play().catch(() => {});
      });
      card.appendChild(playIcon);
    }

    const info = document.createElement("div");
    info.className = "min-w-0 flex-1 pr-4";
    info.innerHTML = `
      <div class="text-xs font-semibold truncate">${asset.name}</div>
      <div class="text-[10px] text-muted uppercase">${asset.type}</div>
    `;
    card.appendChild(info);

    // Delete button
    const delBtn = document.createElement("button");
    delBtn.className = "absolute top-1.5 right-1.5 w-5 h-5 rounded-md text-muted hover:text-[var(--accent)] opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-xs font-bold cursor-pointer";
    delBtn.textContent = "×";
    delBtn.title = "Remove asset";
    delBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      delete uploadedAssets[asset.name];
      renderAssetsGrid();
    });
    card.appendChild(delBtn);

    grid.appendChild(card);
  });
}

function handleFilesUpload(files) {
  Array.from(files).forEach(file => {
    const isImg = file.type.startsWith("image/");
    const isAud = file.type.startsWith("audio/");
    if (!isImg && !isAud) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      uploadedAssets[file.name] = {
        name: file.name,
        type: isImg ? "image" : "audio",
        dataUrl: ev.target.result
      };
      renderAssetsGrid();
      showToast(`Added ${file.name}`);
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById("asset-upload-input").addEventListener("change", (e) => {
  handleFilesUpload(e.target.files);
  e.target.value = "";
});

const dropzone = document.getElementById("asset-dropzone");
dropzone.addEventListener("dragover", (e) => { e.preventDefault(); });
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length) handleFilesUpload(e.dataTransfer.files);
});

// Execution Controls
function setStatus(running, label) {
  const dot = document.getElementById("stage-status-dot");
  dot.style.backgroundColor = running ? "var(--accent)" : "#71717a";
  document.getElementById("stage-status-text").textContent = label;
}

function stopProject() {
  terminateExecutionWorker();
  if (activeRuntime) {
    activeRuntime.stop();
    activeRuntime = null;
  }
  if (pendingAskResolve) {
    pendingAskResolve("");
    pendingAskResolve = null;
  }
  setStatus(false, "Stopped");
}

function runCPercentInPage(source, stdin) {
  const env = Object.create(null);
  const inputLines = String(stdin || "").replace(/\r\n/g, "\n").split("\n");
  let inputIndex = 0;
  const output = [];
  const lines = String(source).replace(/\r/g, "").split("\n").map((raw, index) => {
    let quoted = false;
    let text = "";
    for (let i = 0; i < raw.length; i++) {
      const c = raw[i];
      if (c === '"' && raw[i - 1] !== "\\") quoted = !quoted;
      if (c === "%" && !quoted) break;
      text += c;
    }
    return { text: text.trim(), indent: raw.length - raw.trimStart().length, line: index + 1 };
  }).filter(item => item.text);

  const labels = Object.create(null);
  lines.forEach((item, index) => {
    const match = item.text.match(/^lbl\s*<<\s*(?:\"([^\"]+)\"|([A-Za-z_]\w*))\s*:?\s*$/);
    if (match) labels[match[1] || match[2]] = index;
  });

  const splitTop = (text, separator) => {
    const result = [];
    let current = "";
    let quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"' && text[i - 1] !== "\\") quoted = !quoted;
      if (!quoted && text.startsWith(separator, i)) {
        result.push(current.trim());
        current = "";
        i += separator.length - 1;
      } else {
        current += c;
      }
    }
    result.push(current.trim());
    return result;
  };

  const format = value => {
    if (value == null) return "nothing";
    if (typeof value === "boolean") return value ? "true" : "false";
    if (Array.isArray(value)) return value.length ? value.map(format).join(", ") : "(empty)";
    return String(value);
  };

  const number = value => {
    if (typeof value === "number") return value;
    if (typeof value === "string" && /^-?\d+(?:\.\d+)?$/.test(value.trim())) return Number(value);
    throw new Error(`${format(value)} isn't a number`);
  };

  function evaluate(sourceText) {
    const text = sourceText.trim();
    if (/^".*"$/s.test(text)) return text.slice(1, -1).replace(/\\n/g, "\n");
    if (/^-?\d+$/.test(text)) return Number(text);
    if (/^-?\d*\.\d+$/.test(text)) return Number(text);
    if (text === "true") return true;
    if (text === "false") return false;
    const variable = text.match(/^(?:vari|lst):\s*(?:\"([A-Za-z_]\w*)\"|([A-Za-z_]\w*))$/);
    if (variable) {
      const name = variable[1] || variable[2];
      if (!Object.prototype.hasOwnProperty.call(env, name)) throw new Error(`I don't know a variable called '${name}'`);
      return env[name];
    }
    if (Object.prototype.hasOwnProperty.call(env, text)) return env[text];
    const fn = text.match(/^(sqrt|sin|cos|tan|3rt)\s+(.+)$/);
    if (fn) {
      const value = number(evaluate(fn[2]));
      if (fn[1] === "sqrt") return Math.sqrt(value);
      if (fn[1] === "3rt") return Math.sign(value) * Math.pow(Math.abs(value), 1 / 3);
      return Math.round({ sin: Math.sin, cos: Math.cos, tan: Math.tan }[fn[1]](value * Math.PI / 180) * 1e12) / 1e12;
    }
    const binary = text.match(/^(.+?)\s*(==|=\/=|<=|>=|&&|\|\||[+\-*\/^<>])\s*(.+)$/);
    if (binary) {
      const left = evaluate(binary[1]);
      const right = evaluate(binary[3]);
      const op = binary[2];
      if (op === "==") return String(left) === String(right);
      if (op === "=\/=") return String(left) !== String(right);
      if (op === "<") return number(left) < number(right);
      if (op === ">") return number(left) > number(right);
      if (op === "<=") return number(left) <= number(right);
      if (op === ">=") return number(left) >= number(right);
      if (op === "&&") return Boolean(left) && Boolean(right);
      if (op === "||") return Boolean(left) || Boolean(right);
      if (op === "+") {
        if (Array.isArray(left) && Array.isArray(right)) return left.concat(right);
        if (typeof left === "string" || typeof right === "string") return format(left) + format(right);
        return number(left) + number(right);
      }
      if (op === "-") return number(left) - number(right);
      if (op === "*") return number(left) * number(right);
      if (op === "/") {
        if (number(right) === 0) throw new Error("can't divide by zero");
        return number(left) / number(right);
      }
      if (op === "^") return Math.pow(number(left), number(right));
    }
    throw new Error(`I don't understand '${sourceText}'`);
  }

  function execute(start, end) {
    let index = start;
    while (index < end) {
      const item = lines[index];
      const text = item.text;
      if (/^lbl\b/.test(text)) {
        index++;
        continue;
      }
      if (/^gback\b/.test(text)) {
        const rest = text.replace(/^gback\s*<<\s*/, "").trim();
        let name = rest;
        const quoted = rest.match(/^"([^"]*)"$/);
        if (quoted) name = quoted[1];
        if (!Object.prototype.hasOwnProperty.call(labels, name)) throw new Error(`There's no label called '${name}'`);
        index = labels[name] + 1;
        continue;
      }
      if (/^ndsc\b/.test(text)) break;
      if (/^ptx\b/.test(text)) {
        const rest = text.replace(/^ptx\s*<<\s*/, "").trim();
        const parts = splitTop(rest, "<<");
        const rendered = parts.filter(part => !/^ver\b/.test(part)).map(part => format(evaluate(part))).join("");
        output.push(rendered + "\n");
        index++;
        continue;
      }
      if (/^ptx\s*<<\s*input\b/.test(text)) {
        const rest = text.replace(/^ptx\s*<<\s*input\s*<<\s*/, "").trim();
        const parts = splitTop(rest, "<<");
        if (parts[0]) output.push(format(evaluate(parts[0])) + "\n");
        const store = parts.find(part => /^stin\b/.test(part));
        const match = store && store.match(/^stin\s+"?([A-Za-z_]\w*)"?$/);
        if (match) env[match[1]] = inputLines[inputIndex++] || "";
        index++;
        continue;
      }
      if (/^vari\b/.test(text)) {
        const parts = splitTop(text.replace(/^vari\s*<<\s*/, ""), "<<");
        if (parts.length !== 2) throw new Error("Use: vari << name << value");
        env[parts[0].replace(/"/g, "")] = evaluate(parts[1]);
        index++;
        continue;
      }
      throw new Error(`I don't understand '${text}' in C%`);
    }
  }

  execute(0, lines.length);
  return output.join("");
}

async function runBrowserLanguage(file, language) {
  switchOutputTab("console");
  setStatus(true, `Starting ${language.name}`);
  appendConsole(`Running ${language.name}...`, null, false);
  try {
    let result;
    if (language.id === "cpercent") {
      const needsInput = /\bptx\s*<<\s*input\b/.test(file.code);
      const stdin = needsInput ? await requestConsoleLine("C% program input:") : "";
      const text = runCPercentInPage(file.code, stdin);
      if (text) appendConsole(text, null, false);
      result = { type: "done" };
      if (result && result.type === "done") setStatus(false, "Finished");
    } else if (language.id === "holyc") {
      appendConsole("Using a browser-based HolyC subset interpreter (not the TempleOS compiler).", "#f59e0b", false);
      // MIT Copyright (c) 2026 SolutionsAsService; pinned source/license: github.com/SolutionsAsService/HolyC
      const worker = `importScripts("https://cdn.jsdelivr.net/gh/SolutionsAsService/HolyC@2f5d0dc5e081c177f23e9da65631e82648a3e682/holyc-core.js");
self.onmessage = (e) => {
  try {
    if (!self.HolyC || typeof self.HolyC.run !== "function") throw new Error("The HolyC interpreter failed to load.");
    const result = self.HolyC.run(e.data.code);
    if (result.out) postMessage({type:"output",text:result.out});
    if (!result.ok) throw new Error(result.error || "The HolyC subset interpreter rejected the program.");
    postMessage({type:"done"});
  } catch (err) { postMessage({type:"error",message:err && err.stack ? err.stack : String(err)}); }
};`;
      result = await runWorkerSource(worker, file.code, language.name, 20000);
    } else if (language.id === "brainfuck") {
      const worker = `self.onmessage = (e) => {
  try {
    const code = e.data.code.replace(/[^<>+\-.,\[\]]/g, "");

async function runProject() {
  stopProject();
  clearConsole();
  errorLineNumber = null;
  updateLineNumbers();
  const current = projectFiles.find(f => f.id === runEntryFileId) || activeFile();
  const language = languageForFile(current);
  if (current && current.id === activeFileId && current.kind !== "image") current.code = editor.value;
  const sourceCode = current?.code || "";
  if (["javascript", "python", "c", "lua", "koi", "ruby", "perl", "go", "rust", "cpp", "brainfuck", "lolcode", "cpercent", "zig", "kotlin", "swift", "csharp", "haskell", "typescript", "java", "bash", "assembly", "powershell", "holyc", "objectivec", "ocaml", "php", "r", "nim", "dart", "prolog", "fortran", "elixir", "crystal", "racket", "fsharp"].includes(language.id)) {
    if (!current || current.kind === "image") {
      appendConsole("Select a source-code file before running.", null, true);
      setStatus(false, "No source file");
      return;
    }
    await runBrowserLanguage({ ...current, code: sourceCode }, language);
    return;
  }
  if (language.id === "koi") {
    appendConsole("Koi is a custom language. Its interpreter still needs to be connected to the browser runtime.", "#f59e0b", false);
    appendConsole("No external code runner is used by this version of CrimIDE.", null, false);
    switchOutputTab("console");
    setStatus(false, "Koi runtime unavailable");
    return;
  }
  if (current && !/\.crim$/i.test(current.name) && current.language !== "crim") {
    appendConsole(`The active file is ${language.name}, not Crim+. Switch its language to Crim+ or open a .crim file to use the built-in runtime.`, "#f59e0b", false);
    switchOutputTab("console");
    setStatus(false, "Language mismatch");
    return;
  }

  let program;
  try {
    const moduleStatements = await loadRoseModuleStatements(sourceCode);
    program = [...moduleStatements, ...parseProgram(loadLines(sourceCode))];
  } catch (err) {
    handleError(err);
    return;
  }

  const runtime = new CrimRuntime(canvas, uploadedAssets, {
    onSay: (text, color) => {
      appendConsole(text, color, false);
      if (!runtime.displayOpen) switchOutputTab("console");
    },
    onAsk: (promptText) => requestConsoleLine(promptText),
    onWriteFile: (filename, contents, line) => {
      const safeName = cleanProjectFilename(filename, "output.txt");
      const currentFile = activeFile();
      if (currentFile && currentFile.kind !== "image") currentFile.code = editor.value;
      let target = projectFiles.find(file => file.name.toLowerCase() === safeName.toLowerCase());
      if (target && target.kind === "image") throw new CrimError(`Line ${line}: '${safeName}' is an image asset and cannot be overwritten as text.`, line);
      if (!target) {
        target = { id: "file_" + Date.now() + Math.random().toString(36).slice(2, 7), name: safeName, code: contents };
        projectFiles.push(target);
      } else {
        target.code = contents;
      }
      if (target.id === activeFileId) editor.value = contents;
      renderFileTabs(); updateLineNumbers(); updateCursorPos(); scheduleAutosave();
      appendConsole(`Wrote ${contents.length} characters to ${safeName}`, "#86efac", false);
    },
    onError: (err) => handleError(err)
  });

  activeRuntime = runtime;
  setStatus(true, "Running");

  try {
    await runtime.runBlock(program);
    if (runtime.aborted) return;

    if (runtime.displayOpen) {
      switchOutputTab("stage");
      runtime.render();
      runtime.startLoop();
    } else {
      switchOutputTab("console");
      setStatus(false, "Finished");
    }
  } catch (err) {
    runtime.stop();
    handleError(err);
  }
}

function handleError(err) {
  setStatus(false, "Error");
  switchOutputTab("console");
  const msg = err instanceof CrimError ? err.message : `Error: ${err.message}`;
  appendConsole(msg, null, true);
  if (err.line) {
    errorLineNumber = err.line;
    updateLineNumbers();
  }
}

async function importTextOrImageFile(file) {
  try {
    if (file.size > 5 * 1024 * 1024) throw new Error("File is too large for the text editor");
    if (file.type.startsWith("image/")) {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      addFile(file.name, "", { kind: "image", dataUrl, mimeType: file.type });
      showToast(`Imported image ${file.name}`);
    } else {
      const textContent = await file.text();
      if (textContent.includes("\\u0000")) throw new Error("This binary format has no previewer yet");
      addFile(file.name, textContent);
      showToast(`Imported ${file.name}`);
    }
  }
  catch (_) { showToast("Could not read that file"); }
}

    bar.addEventListener('keydown', e => {
      const keys = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
      if (!keys.includes(e.key)) return;
      e.preventDefault();
      const step = e.shiftKey ? 5 : 2;
      const prop = which === 'editor' ? (mobile() ? '--editor-pane-size-mobile' : '--editor-pane-size') : '--stage-pane-size';
      const min = which === 'editor' ? 20 : 18, max = which === 'editor' ? 80 : 88;
      let v = parseFloat(getComputedStyle(main).getPropertyValue(prop)) || (which === 'editor' ? 50 : 60);
      v += (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? step : -step);
      main.style.setProperty(prop, Math.max(min,Math.min(max,v)) + '%');
      persist();
    });
  }
  keyResize(workspaceBar,'editor'); keyResize(stageBar,'stage');
})();
</script>

function iconMarkup(x){if(customLogos[x[0]])return `<img class="lang-custom-logo" src="${customLogos[x[0]]}" alt="${x[1]} logo">`;if(embeddedBrandLogos[x[0]])return embeddedBrandLogos[x[0]];const color=brandColors[x[0]]||'#888888';if(x[4]&&simpleIconIds.has(x[0])){const url=`https://cdn.jsdelivr.net/gh/simple-icons/simple-icons@v15/icons/${x[4]}.svg`;return `<span class="lang-mark has-mask" style="--brand-color:${color};--logo-mask:url('${url}')" role="img" aria-label="${x[1]} logo"></span>`;}return `<span class="lang-mark" style="--brand-color:${color}" aria-hidden="true">${fallbackMarks[x[0]]||x[1].slice(0,2).toUpperCase()}</span>`;}
function render(){let q=search.value.toLowerCase();grid.innerHTML='';data.filter(x=>(category==='All'||x[3]===category)&&(`${x[1]} ${x[2]} ${x[3]}`.toLowerCase().includes(q))).forEach(x=>{let b=document.createElement('button');b.className='lang-card'+(native.value===x[0]?' selected':'');b.innerHTML=`<div class="flex items-center gap-3">${iconMarkup(x)}<div class="font-bold text-sm">${x[1]}</div></div><div class="text-xs text-muted mt-2 leading-relaxed">${x[2]}</div><div class="text-[10px] text-muted mt-2">${x[3]}</div>`;b.onclick=()=>{native.value=x[0];native.dispatchEvent(new Event('change',{bubbles:true}));document.getElementById('language-picker-current').textContent=x[1];modal.classList.add('hidden');modal.classList.remove('flex');};grid.appendChild(b)});}
catBox.addEventListener('click',e=>{let b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;catBox.querySelectorAll('.lang-filter').forEach(z=>z.classList.toggle('active',z===b));render()});search.addEventListener('input',render);
document.getElementById('language-picker-trigger').onclick=()=>{modal.classList.remove('hidden');modal.classList.add('flex');search.value='';category='All';catBox.querySelectorAll('.lang-filter').forEach(z=>z.classList.toggle('active',z.dataset.category==='All'));render();search.focus()};document.getElementById('language-picker-close').onclick=()=>{modal.classList.add('hidden');modal.classList.remove('flex')};modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.add('hidden');modal.classList.remove('flex')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal.classList.add('hidden');modal.classList.remove('flex')}});
})();
