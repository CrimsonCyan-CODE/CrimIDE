<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrimIDE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <style>
    :root {
      --bg-app: #0c0c0e;
      --bg-panel: #131317;
      --bg-sub: #19191f;
      --bg-hover: #212129;
      --border-main: #24242b;
      --text-main: #f4f4f6;
      --text-muted: #8e8e9a;
      --accent: #e11d48;
      --accent-hover: #ff2a5f;
      --accent-soft: rgba(225, 29, 72, 0.14);
      --accent-border: rgba(225, 29, 72, 0.35);
      --stage-well: #09090b;
    }

    body.light-theme {
      --bg-app: #ffffff;
      --bg-panel: #f9f9fb;
      --bg-sub: #ffffff;
      --bg-hover: #fdf2f8;
      --border-main: #f1d5e3;
      --text-main: #1f1620;
      --text-muted: #7a5c6c;
      --accent: #ec4899;
      --accent-hover: #f43f5e;
      --accent-soft: rgba(236, 72, 153, 0.12);
      --accent-border: rgba(236, 72, 153, 0.35);
      --stage-well: #fdf2f8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
      font-variant-ligatures: none;
    }

    .panel-bg {
      background-color: var(--bg-panel);
      border-color: var(--border-main);
    }

    .sub-bg {
      background-color: var(--bg-sub);
      border-color: var(--border-main);
    }

    .border-theme {
      border-color: var(--border-main);
    }

    .text-muted {
      color: var(--text-muted);
    }

    .accent-btn {
      background-color: var(--accent);
      color: #ffffff;
    }
    .accent-btn:hover {
      background-color: var(--accent-hover);
    }

    .accent-pill {
      background-color: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    /* Clean thin scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-main);
      border-radius: 9999px;
    }

    /* Line-numbered editor */
    .editor-shell {
      display: flex;
      flex: 1;
      overflow: hidden;
      background-color: var(--bg-app);
    }
    .line-numbers {
      width: 46px;
      padding: 18px 10px 18px 0;
      text-align: right;
      color: var(--text-muted);
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-main);
      user-select: none;
      overflow: hidden;
      line-height: 1.65;
      font-size: 13.5px;
    }
    .line-num-item {
      padding-right: 4px;
      border-radius: 4px;
    }
    .line-num-error {
      background-color: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }
    #line-numbers { display: none !important; }
    #monaco-editor { flex: 1; min-width: 0; min-height: 0; width: 100%; }
    #code-editor {
      flex: 1;
      padding: 18px;
      background: transparent;
      color: var(--text-main);
      border: none;
      outline: none;
      resize: none;
      line-height: 1.65;
      font-size: 13.5px;
      tab-size: 4;
      white-space: pre;
      overflow: auto;
    }

    .file-tab { padding: 7px 11px; border: 1px solid var(--border-main); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--bg-sub); color: var(--text-muted); font-size: 11px; white-space: nowrap; }
    .file-tab.active { background: var(--bg-app); color: var(--text-main); border-color: var(--accent-border); box-shadow: inset 0 2px 0 var(--accent); }
    .file-tab:hover { color: var(--text-main); }
    .file-strip { background: var(--bg-panel); border-bottom: 1px solid var(--border-main); }
    .save-indicator { color: var(--text-muted); font-size: 10px; white-space: nowrap; }
    .modal-backdrop { background: rgba(0,0,0,.68); backdrop-filter: blur(4px); }
    .module-row { border: 1px solid var(--border-main); background: var(--bg-sub); border-radius: 10px; padding: 10px 12px; }
    .stage-well {
      background-color: var(--stage-well);
    }

    /* Draggable workspace splitters */
    #editor-pane { flex: 0 0 var(--editor-pane-size, 50%); min-width: 0; min-height: 0; }
    #right-pane { flex: 1 1 0; min-width: 0; min-height: 0; }
    #stage-pane { flex: 0 0 var(--stage-pane-size, 60%); min-height: 0; }
    #asset-dropzone { flex: 1 1 0; min-height: 0; }
    .resize-splitter { flex: 0 0 8px; background: var(--bg-panel); position: relative; z-index: 5; touch-action: none; user-select: none; }
    .resize-splitter::after { content: ''; position: absolute; background: var(--border-main); border-radius: 4px; }
    .vertical-splitter { cursor: col-resize; }
    .vertical-splitter::after { width: 3px; height: 34px; left: 50%; top: 50%; transform: translate(-50%,-50%); }
    .horizontal-splitter { cursor: row-resize; }
    .horizontal-splitter::after { height: 3px; width: 34px; left: 50%; top: 50%; transform: translate(-50%,-50%); }
    .resize-splitter:hover, .resize-splitter.dragging { background: var(--accent-soft); }
    .resize-splitter:hover::after, .resize-splitter.dragging::after { background: var(--accent); }
    body.resizing-panels { user-select: none !important; }
    @media (max-width: 1023px) {
      #app-main { flex-direction: column !important; }
      #editor-pane { flex: 0 0 var(--editor-pane-size-mobile, 50%); width: 100%; }
      #right-pane { flex: 1 1 0; width: 100%; }
      .vertical-splitter { cursor: row-resize; }
      .vertical-splitter::after { width: 34px; height: 3px; }
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- TOP HEADER BAR -->
  <header id="app-header" class="panel-bg border-b px-5 py-3 flex items-center justify-between gap-4 shrink-0">
    <!-- Left: Brand + Run / Stop -->
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg accent-btn flex items-center justify-center font-extrabold text-sm tracking-tight shadow-sm">
          C+
        </div>
        <span class="font-extrabold text-base tracking-tight">CrimIDE</span>
      </div>

      <div class="h-5 w-px bg-[var(--border-main)]"></div>

      <div class="flex items-center gap-2">
        <button id="language-picker-trigger" class="sub-bg border rounded-lg px-3 py-2 text-xs font-semibold focus:outline-none cursor-pointer flex items-center gap-2 hover:border-[var(--accent)] transition" title="Choose a programming language"><span id="language-picker-current">Crim+</span><span class="text-muted">▾</span></button>
        <select id="language-select" class="hidden" aria-hidden="true" tabindex="-1">
          <option value="assembly">Assembly (NASM)</option><option value="bash">Bash</option><option value="brainfuck">Brainfuck</option><option value="c">C</option><option value="csharp">C#</option><option value="cpp">C++</option><option value="cpercent">C%</option><option value="crim" selected>Crim+</option><option value="go">Go</option><option value="haskell">Haskell</option><option value="holyc">HolyC</option><option value="java">Java</option><option value="javascript">JavaScript</option><option value="koi">Koi</option><option value="kotlin">Kotlin</option><option value="lolcode">LOLCODE</option><option value="lua">Lua</option><option value="objectivec">Objective-C</option><option value="ocaml">OCaml</option><option value="perl">Perl</option><option value="php">PHP</option><option value="powershell">PowerShell</option><option value="python">Python</option><option value="r">R</option><option value="ruby">Ruby</option><option value="rust">Rust</option><option value="swift">Swift</option><option value="typescript">TypeScript</option><option value="zig">Zig</option>
        </select>
        <button id="btn-run" class="accent-btn flex items-center gap-1.5 font-semibold text-xs px-4 py-2 rounded-lg transition cursor-pointer shadow-sm">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
          <span>Run</span>
        </button>
        <button id="btn-stop" class="sub-bg border hover:opacity-80 flex items-center gap-1.5 font-semibold text-xs px-3.5 py-2 rounded-lg transition cursor-pointer">
          <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          <span>Stop</span>
        </button>
      </div>
    </div>

    <!-- Right: Examples + Export .crim + Dark/Light Theme Toggle -->
    <div class="flex items-center gap-2.5">

      <button id="btn-download-crim" class="sub-bg border hover:opacity-80 text-xs font-semibold px-3 py-1.5 rounded-lg transition cursor-pointer">Export .crim</button>
      <button id="btn-export-project" class="sub-bg border hover:opacity-80 text-xs font-semibold px-3 py-1.5 rounded-lg transition cursor-pointer">Export Project</button>
      <button id="btn-import-project" class="sub-bg border hover:opacity-80 text-xs font-semibold px-3 py-1.5 rounded-lg transition cursor-pointer">Open Project</button>

      <label class="text-[11px] text-muted flex items-center gap-1.5">Theme
        <select id="theme-select" class="sub-bg border rounded-lg px-2.5 py-1.5 text-xs">
          <option value="dark">Dark</option><option value="light">Light</option>
        </select>
      </label>
    </div>
  </header>

  <!-- MAIN 2-COLUMN WORKSPACE -->
  <main id="app-main" class="flex flex-1 flex-col lg:flex-row overflow-hidden">

    <!-- LEFT HALF (50%): PURE CODE EDITOR -->
    <section id="editor-pane" class="w-full lg:w-auto h-1/2 lg:h-full flex flex-col border-b lg:border-b-0 lg:border-r border-theme">
      <details id="project-explorer" class="mx-3 mt-2 sub-bg border rounded-lg text-xs shrink-0">
        <summary class="px-3 py-2 cursor-pointer font-semibold">Project explorer <span id="explorer-count" class="text-muted font-normal"></span></summary>
        <div id="explorer-tree" class="px-2 pb-2 max-h-28 overflow-auto font-mono-code"></div>
      </details>
      <div class="file-strip px-3 pt-2 flex items-end gap-1 shrink-0">
        <div id="file-tabs" class="flex items-end gap-1 overflow-x-auto flex-1 min-w-0"></div>
        <button id="btn-new-file" class="accent-btn rounded-md px-2.5 py-1.5 text-xs font-bold mb-1" title="Add a file">＋</button>
        <button id="btn-import-file" class="sub-bg border rounded-md px-2.5 py-1.5 text-xs mb-1" title="Import a text file of any extension">Import</button>
        <button id="btn-rename-file" class="sub-bg border rounded-md px-2.5 py-1.5 text-xs mb-1" title="Rename selected file">Rename</button>
        <button id="btn-delete-file" class="sub-bg border rounded-md px-2.5 py-1.5 text-xs mb-1" title="Delete selected file">Delete</button>
        <input id="file-import-input" type="file" accept="*/*" multiple class="hidden">
        <input id="project-import-input" type="file" accept=".crimproj,.json,application/json" class="hidden">
      </div>
      <div class="panel-bg border-b px-4 py-2 flex items-center justify-between text-xs shrink-0">
        <span class="font-semibold">Code</span>
        <span class="flex items-center gap-2">
          <label class="text-muted flex items-center gap-1">Size <input id="setting-font-size" type="number" min="10" max="24" value="13" class="sub-bg border rounded px-1 py-1 w-10"></label>
          <label class="text-muted flex items-center gap-1">Tab <select id="setting-tab-size" class="sub-bg border rounded px-1 py-1"><option>2</option><option selected>4</option><option>8</option></select></label>
          <label class="text-muted flex items-center gap-1"><input id="setting-word-wrap" type="checkbox" checked> Wrap</label>
          <button id="btn-format-code" class="sub-bg border rounded px-2 py-1" title="Format document">Format</button>
          <span class="flex items-center gap-3"><span id="save-status" class="save-indicator">Not saved</span><span id="cursor-pos" class="text-muted font-mono-code text-[11px]">Ln 1, Col 1</span></span>
      </div>

      <div id="editor-shell" class="editor-shell">
        <div id="line-numbers" class="line-numbers font-mono-code">
          <div class="line-num-item">1</div>
        </div>
        <div id="monaco-editor" aria-label="Code editor"></div>
        <textarea id="code-editor" class="font-mono-code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Write your Crim+ code here..." style="display:none"></textarea>
      </div>
      <div id="file-preview" class="hidden flex-1 min-h-0 overflow-auto bg-[var(--bg-app)] p-6 items-center justify-center">
        <div class="max-w-full flex flex-col items-center gap-3">
          <img id="file-preview-image" class="hidden max-w-full max-h-[65vh] object-contain rounded-lg border border-theme shadow-lg" alt="File preview">
          <div id="file-preview-details" class="text-xs text-muted font-mono-code"></div>
        </div>
      </div>
    </section>

    <div id="workspace-splitter" class="resize-splitter vertical-splitter" role="separator" aria-label="Resize code editor and output panels" tabindex="0" title="Drag to resize panels"></div>

    <!-- RIGHT HALF (50%): TOP OUTPUTS (60%) + BOTTOM IMAGES & AUDIO (40%) -->
    <section id="right-pane" class="w-full lg:w-auto h-1/2 lg:h-full flex flex-col overflow-hidden">

      <!-- TOP RIGHT (60%): OUTPUT AREA (STAGE & CONSOLE) -->
      <div id="stage-pane" class="flex flex-col border-b border-theme overflow-hidden">
        <!-- Output Header & Tabs -->
        <div class="panel-bg border-b px-4 py-2 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-xs mr-2">Output</span>
            <select id="run-entry-select" class="sub-bg border rounded-md px-2 py-1 text-[11px] max-w-36" title="Run configuration · entry file"></select>
            <select id="c-standard-select" class="sub-bg border rounded-md px-2 py-1 text-[11px] hidden" title="C language standard">
              <option value="c11">C11</option><option value="c17">C17</option><option value="c23">C23</option>
            </select>
            <button id="tab-stage" class="accent-pill text-xs font-semibold px-3 py-1 rounded-md cursor-pointer transition">
              Stage
            </button>
            <button id="tab-console" class="text-muted hover:text-[var(--text-main)] text-xs font-semibold px-3 py-1 rounded-md cursor-pointer transition flex items-center gap-1.5">
              <span>Console</span>
              <span id="console-badge" class="hidden text-[10px] px-1.5 py-0.2 rounded-full accent-btn">0</span>
            </button>
          </div>

          <div class="flex items-center gap-2 text-[11px] text-muted font-mono-code">
            <button id="btn-clear-console" class="sub-bg border rounded px-2 py-1 hover:opacity-80" title="Clear console">Clear</button>
            <button id="btn-copy-console" class="sub-bg border rounded px-2 py-1 hover:opacity-80" title="Copy console output">Copy</button>
            <span id="stage-status-dot" class="w-2 h-2 rounded-full bg-zinc-500"></span>
            <span id="stage-status-text">Ready</span>
          </div>
        </div>

        <!-- Stage View -->
        <div id="view-stage" class="stage-well flex-1 p-4 flex items-center justify-center overflow-auto">
          <div class="rounded-xl overflow-hidden border border-theme shadow-md">
            <canvas id="stage-canvas" width="760" height="320" class="block max-w-full h-auto cursor-crosshair"></canvas>
          </div>
        </div>

        <!-- Console View -->
        <div id="view-console" class="hidden flex-1 flex flex-col overflow-hidden bg-[var(--bg-app)]">
          <div id="console-output" class="flex-1 p-4 overflow-y-auto font-mono-code text-xs space-y-1.5">
            <div class="text-muted italic">Console output from 'say' and error messages will appear here.</div>
          </div>
          <!-- Always-available console input, used for interactive program input -->
          <div id="console-input-bar" class="p-2.5 panel-bg border-t flex items-center gap-2 shrink-0">
            <span id="console-prompt-label" class="text-sm font-semibold text-rose-400">›</span>
            <input id="console-input-field" type="text" class="flex-1 bg-transparent border-0 px-2 py-1.5 text-xs font-mono-code focus:outline-none" placeholder="Type input here and press Enter when the program asks..." autocomplete="off" />
            <button id="console-input-submit" class="accent-btn text-xs font-semibold px-3.5 py-1.5 rounded-lg cursor-pointer">Enter</button>
          </div>
        </div>
      </div>

      <div id="stage-assets-splitter" class="resize-splitter horizontal-splitter" role="separator" aria-label="Resize stage and assets panels" tabindex="0" title="Drag to resize stage and assets"></div>

      <!-- BOTTOM RIGHT (40%): IMAGES & AUDIO -->
      <div id="asset-dropzone" class="flex flex-col overflow-hidden panel-bg">
        <div class="border-b border-theme px-4 py-2 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-xs">Images & Audio</span>
            <span class="text-[11px] text-muted hidden sm:inline">(Click any item to copy its name)</span>
          </div>
          <label class="accent-btn text-xs font-semibold px-3 py-1 rounded-lg cursor-pointer transition">
            + Upload
            <input id="asset-upload-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,audio/wav,audio/mpeg,audio/mp3,audio/ogg" multiple class="hidden" />
          </label>
        </div>

        <div class="flex-1 p-3.5 overflow-y-auto">
          <div id="assets-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>

    </section>
  </main>

  <div id="find-replace-modal" class="hidden fixed inset-0 z-40 modal-backdrop items-center justify-center p-4">
    <div class="panel-bg border rounded-xl shadow-2xl w-full max-w-md p-4 space-y-3">
      <div class="flex items-center justify-between"><strong class="text-sm">Find and replace</strong><button id="find-close" class="text-muted px-2">✕</button></div>
      <input id="find-query" class="w-full sub-bg border rounded-lg px-3 py-2 text-xs font-mono-code" placeholder="Find text">
      <input id="replace-query" class="w-full sub-bg border rounded-lg px-3 py-2 text-xs font-mono-code" placeholder="Replace with">
      <div class="flex justify-between items-center"><span id="find-status" class="text-[11px] text-muted"></span><div class="flex gap-2"><button id="find-next" class="sub-bg border rounded-lg px-3 py-2 text-xs">Find next</button><button id="replace-all" class="accent-btn rounded-lg px-3 py-2 text-xs font-semibold">Replace all</button></div></div>
    </div>
  </div>

  <!-- Minimal Toast -->
  <div id="toast" class="fixed bottom-4 right-4 accent-btn text-xs font-semibold px-3.5 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50">
    Copied!
  </div>


<script>
/* CrimIDE language registry
 * Each entry is a small language plugin descriptor. Execution adapters can be
 * added later without changing the editor's core UI.
 */
(function () {
  const languages = {
    assembly: { id:"assembly", name:"Assembly (NASM)", extensions:[".asm",".nasm"], mode:"asm", runner:"judge0", runtimeLabel:"NASM (Judge0 CE, internet required)", starter:'global _start\n\nsection .data\n    message db "Hello world!", 10\n    message_length equ $ - message\n\nsection .text\n_start:\n    mov rax, 1\n    mov rdi, 1\n    mov rsi, message\n    mov rdx, message_length\n    syscall\n    mov rax, 60\n    xor rdi, rdi\n    syscall\n', placeholder:"Write your NASM Assembly code here..." },
    bash: { id:"bash", name:"Bash", extensions:[".sh",".bash"], mode:"shell", runner:"judge0", runtimeLabel:"Bash (Judge0 CE, internet required)", starter:'#!/usr/bin/env bash\necho "Hello world!"\n', placeholder:"Write your Bash script here..." },
    c: { id:"c", name:"C", extensions:[".c",".h"], mode:"c", runner:"browsercc", runtimeLabel:"Clang WebAssembly compiler (downloaded on first run)", starter:'#include <stdio.h>\n\nint main(void) {\n    printf("Hello, World!\\n");\n    return 0;\n}\n', placeholder:"Write your C code here..." },
    csharp: { id:"csharp", name:"C#", extensions:[".cs"], mode:"csharp", runner:"judge0", runtimeLabel:"C# Mono (Judge0 CE, internet required)", starter:'using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello world!");\n    }\n}\n', placeholder:"Write your C# code here..." },
    python: { id:"python", name:"Python", extensions:[".py",".pyw"], mode:"python", runner:"pyodide", runtimeLabel:"Pyodide (WebAssembly worker)", starter:'print("Hello world!")\n', placeholder:"Write your Python code here..." },
    haskell: { id:"haskell", name:"Haskell", extensions:[".hs"], mode:"haskell", runner:"judge0", runtimeLabel:"Haskell GHC (Judge0 CE, internet required)", starter:'main :: IO ()\nmain = putStrLn "Hello world!"\n', placeholder:"Write your Haskell code here..." },
    holyc: { id:"holyc", name:"HolyC", extensions:[".hc"], mode:"holyc", runner:"browser-holyc", runtimeLabel:"HolyC subset interpreter (browser-local, MIT)", starter:'Print("Hello world!\\n");\n', placeholder:"Write your HolyC code here..." },
    java: { id:"java", name:"Java", extensions:[".java"], mode:"java", runner:"judge0", runtimeLabel:"Java (Judge0 CE, internet required)", starter:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello world!");\n    }\n}\n', placeholder:"Write your Java code here..." },
    lua: { id:"lua", name:"Lua", extensions:[".lua"], mode:"lua", runner:"fengari", runtimeLabel:"Fengari Lua VM (browser bundle)", starter:'print("Hello world!")\n', placeholder:"Write your Lua code here..." },
    koi: { id:"koi", name:"Koi", extensions:[".koi"], mode:"koi", runner:"wasm", runtimeLabel:"Koi interpreter (WebAssembly, stdin enabled)", starter:'fun main::{\n    pri!("Hello world!")\n}\n', placeholder:"Write your Koi code here..." },
    crim: { id:"crim", name:"Crim+", extensions:[".crim"], mode:"crimplus", runner:"builtin", runtimeLabel:"Built-in Crim+ interpreter", starter:'say "Hello world!"\n', placeholder:"Write your Crim+ code here..." },
    ruby: { id:"ruby", name:"Ruby", extensions:[".rb"], mode:"ruby", runner:"ruby-wasm", runtimeLabel:"CRuby WebAssembly (Ruby 4.0)", starter:'puts "Hello world!"\n', placeholder:"Write your Ruby code here..." },
    perl: { id:"perl", name:"Perl", extensions:[".pl",".pm"], mode:"perl", runner:"perl-wasm", runtimeLabel:"Perl 5.44 WebAssembly", starter:'print "Hello world!\\n";\n', placeholder:"Write your Perl code here..." },

function parseTarget(text, line) {
  const t = text.trim();
  const tm = t.match(/^that\s+(\w+)$/i);
  if (tm) return ["that", tm[1]];
  if (/^[A-Za-z_]\w*$/.test(t)) return ["name", t];
  throw new CrimError(`Line ${line}: Unknown target '${t}'.`, line);
}

function parseCondition(text, line) {
  const s = text.trim();
  for (const [word, kind] of [["or", "or"], ["and", "and"]]) {
    const pieces = splitLogic(s, word);
    if (pieces.length > 1) return [kind, pieces.map(p => parseCondition(p, line))];
  }
  if (/^not\s+/i.test(s)) return ["not", parseCondition(s.replace(/^not\s+/i, ""), line)];

  const touchM = s.match(/^((?:that\s+)?\w+)\s+(?:is\s+(not\s+)?touching|touches)\s+((?:that\s+)?\w+)$/i);
  if (touchM) return ["touching", parseTarget(touchM[1], line), parseTarget(touchM[3], line), Boolean(touchM[2])];

  const unaries = [
    [" is not a color", "not color"], [" is a color", "color"],
    [" is not a number", "not number"], [" is a number", "number"],
    [" contains letters", "letters"]
  ];
  for (const [suffix, kind] of unaries) {
    if (s.toLowerCase().endsWith(suffix)) return [kind, parseOperand(s.slice(0, -suffix.length), line)];
  }

  const membership = [
    [/^(.+?)\s+does not contain\s+(.+)$/i, "not contains"],
    [/^(.+?)\s+contains\s+(.+)$/i, "contains"],
    [/^(.+?)\s+starts with\s+(.+)$/i, "starts"],
    [/^(.+?)\s+ends with\s+(.+)$/i, "ends"]
  ];
  for (const [rx, kind] of membership) {
    const m = s.match(rx);
    if (m) return [kind, parseOperand(m[1], line), parseOperand(m[2], line)];
  }

  const compM = s.match(/^(.+?)\s*(<\s*or\s*=|>\s*or\s*=|<=|>=|!=|<|>|=|\s+is not\s+|\s+is\s+)\s*(.+)$/i);
  if (!compM) throw new CrimError(`Line ${line}: Invalid condition '${s}'.`, line);
  return ["compare", compM[2].replace(/\s+/g, "").toLowerCase(), parseOperand(compM[1], line), parseOperand(compM[3], line)];
}

function parseShape(value, line) {
  const m = value.trim().toLowerCase().match(/^(?:(\d+)\s+sides?|(circle|oval|ellipse|square|triangle))$/);
  if (!m) throw new CrimError(`Line ${line}: Unknown shape '${value}'.`, line);
  if (m[2]) {
    if (m[2] === "square") return ["polygon", 4];
    if (m[2] === "triangle") return ["polygon", 3];
    return ["circle", 0];
  }
  const sides = parseInt(m[1], 10);
  if (sides < 3) throw new CrimError(`Line ${line}: A shape needs at least 3 sides.`, line);
  return ["polygon", sides];
}

function normalizeKey(text) {
  let k = text.trim().toLowerCase().replace(/^the\s+/, "").replace(/\s+key$/, "");
  return KEY_ALIASES[k] || k;
}

function parseKeyCondition(text, defaultMode) {
  const groups = [];
  for (const chunk of splitLogic(text.trim(), "or")) {
    const terms = splitLogic(chunk, "and").map(piece => {
      let mode = defaultMode, p = piece.trim();
      const km = p.match(/^(.+?)\s+is\s+(pressed|held)$/i);
      if (km) { p = km[1]; mode = km[2].toLowerCase(); }
      return ["key", normalizeKey(p), mode];
    });
    groups.push(terms.length === 1 ? terms[0] : ["and", terms]);
  }
  return groups.length === 1 ? groups[0] : ["or", groups];
}

function parseProgram(lines) {
  const expanded = [];
  for (const l of lines) {
    const m = l.text.match(/^(?:this script uses:\s*|use\s+)(\w+(?:\s*(?:,\s*and\s+|,|\s+and\s+)\s*\w+)+)$/i);
    if (m) {
      for (const mod of m[1].split(/\s*(?:,\s*and\s+|,|\s+and\s+)\s*/)) {
        expanded.push({ text: `use ${mod.trim()}`, number: l.number });
      }
    } else {
      expanded.push(l);
    }
  }
  const res = parseBlock(expanded, 0, null);
  if (res.pos < expanded.length) {
    throw new CrimError(`Line ${expanded[res.pos].number}: Unexpected '${expanded[res.pos].text}'.`, expanded[res.pos].number);
  }
  return res.stmts;
}

function parseBlock(lines, pos, opener, hint = null) {
  const stmts = [];
  while (pos < lines.length) {
    const { text } = lines[pos];
    if (/^(but if\b|anything else\b)/i.test(text) || /^end\s+(if|repeat|forever|while|always|when|for each|definition|instruction|every|after)\b/i.test(text) || /^end\s+\w+\s+(?:details|definition)$/i.test(text)) {
      return { stmts, pos };
    }
    if (opener && opener.kind === "click handler" && /^when\s+(?:(left|right|middle)\s+)?clicked\s*,?\s*do:?$/i.test(text)) {
      return { stmts, pos };
    }
    const parsed = parseStatement(lines, pos);
    stmts.push(parsed.stmt);
    pos = parsed.pos;
  }
  if (opener) {
    throw new CrimError(`Line ${opener.line}: This ${opener.kind} block was never closed. ${hint || `Add 'end ${opener.kind}'.`}`, opener.line);
  }
  return { stmts, pos };
}

function expectEnd(lines, pos, kind, openLine) {
  if (pos >= lines.length) throw new CrimError(`Line ${openLine}: Expected 'end ${kind}'.`, openLine);
  const { text, number } = lines[pos];
  const m = text.match(/^end\s+(if|repeat|forever|while|always|when|for each|definition|instruction|every|after)$/i);
  if (!m || m[1].toLowerCase() !== kind.toLowerCase()) {
    throw new CrimError(`Line ${number}: Expected 'end ${kind}', found '${text}'.`, number);
  }
  return pos + 1;
}

function parseElement(lines, pos, name, kind, line) {
  let spec;
  if (kind === "tile") {
    spec = { kind: "tile", w: 1, h: 1, texture: null, color: null, on_click: null, on_click_right: null, on_click_middle: null };
  } else if (kind === "particles") {
    spec = {
      kind: "particles", position: "center", opacity: 1.0, dx: 0, dy: 0, rotation: 0,
      colors: [[255, 255, 255]], size: [4, 4], amount: 20, rate: 30,
      speed: [60, 160], lifetime: [0.6, 1.2], direction: 0, spread: 360,
      gravity: 0, shape: ["circle", 0], fade: false, shrink: false
    };
  } else if (kind === "character") {
    spec = { kind: "character" };
  } else if (kind === "sound") {
    spec = { kind: "sound", sound: null, volume: 1.0, speed: 1.0, pitch: 1.0, reverse: false };
  } else {
    spec = {
      kind, position: "center", opacity: 1.0, on_click: null, on_click_right: null, on_click_middle: null,
      dx: 0, dy: 0, rotation: 0, anchor: { h: "center", v: "center" }, pos_expr: {}
    };
    if (kind === "text") Object.assign(spec, { text: null, font: "Inter, sans-serif", size: 28, color: "white" });
    else if (kind === "image") Object.assign(spec, { picture: null, width: null, height: null });
    else if (kind === "list") Object.assign(spec, { items: [] });
    else if (kind === "grid") Object.assign(spec, { rows: 3, columns: 3, gap: 10, shape: ["polygon", 4], width: 40, height: 40, color: "white" });
    else Object.assign(spec, { shape: ["polygon", 4], width: 60, height: 60, color: "white" });
  }

  const closer = new RegExp(`^end\\s+${name}\\s+(?:details|definition)$`, "i");
  pos++;
  while (pos < lines.length) {
    const { text, number } = lines[pos];
    if (closer.test(text)) {
      if (kind === "text" && !spec.text) throw new CrimError(`Line ${line}: '${name}' needs a 'text says ...' line.`, line);
      if (kind === "image" && !spec.picture) throw new CrimError(`Line ${line}: '${name}' needs a 'picture is "..."' line.`, line);
      if (kind === "sound" && !spec.sound) throw new CrimError(`Line ${line}: '${name}' needs a 'sound is "..."' line.`, line);
      return { stmt: ["element", name, spec, kind, line], pos: pos + 1 };
    }

    const wm = text.match(/^when\s+(?:(left|right|middle)\s+)?clicked\s*,?\s*do:?$/i);
    if (wm) {
      const btn = (wm[1] || "left").toLowerCase();
      const key = btn === "right" ? "on_click_right" : btn === "middle" ? "on_click_middle" : "on_click";
      const blk = parseBlock(lines, pos + 1, { kind: "click handler", line: number }, `Add 'end ${name} details'.`);
      spec[key] = blk.stmts;
      pos = blk.pos;
      continue;
    }

    if (kind === "particles") { parseParticleDetail(text, number, spec); pos++; continue; }
    if (kind === "tile") {
      const sm = text.match(/^size\s+is\s+(\d+(?:\.\d+)?)\s*(?:x|by)\s*(\d+(?:\.\d+)?)$/i);
      if (sm) { spec.w = parseFloat(sm[1]); spec.h = parseFloat(sm[2]); pos++; continue; }
      const tm = text.match(/^texture\s+is\s+(.+)$/i);
      if (tm) { spec.texture = unquote(tm[1]); pos++; continue; }
    }
    if (kind === "sound" && /^played (?:in )?reverse$/i.test(text)) { spec.reverse = true; pos++; continue; }

    parseDetail(text, number, spec);
    pos++;
  }
  throw new CrimError(`Line ${line}: '${name}' needs 'end ${name} details'.`, line);
}

function parseParticleDetail(text, line, spec) {
  let m;
  if ((m = text.match(/^colou?rs?\s+(?:is|are)\s+(.+)$/i))) {
    spec.colors = m[1].split(",").map(s => resolveColor(unquote(s.trim()), line));
  } else if ((m = text.match(/^size\s+is\s+(\d+(?:\.\d+)?)(?:\s*(?:to|-)\s*(\d+(?:\.\d+)?))?/i))) {
    const a = parseFloat(m[1]), b = m[2] ? parseFloat(m[2]) : a;
    spec.size = [Math.min(a, b), Math.max(a, b)];
  } else if ((m = text.match(/^amount\s+is\s+(\d+)/i))) spec.amount = parseInt(m[1], 10);
  else if ((m = text.match(/^rate\s+is\s+(\d+(?:\.\d+)?)/i))) spec.rate = parseFloat(m[1]);
  else if ((m = text.match(/^speed\s+is\s+(\d+(?:\.\d+)?)(?:\s*(?:to|-)\s*(\d+(?:\.\d+)?))?/i))) {
    const a = parseFloat(m[1]), b = m[2] ? parseFloat(m[2]) : a;
    spec.speed = [Math.min(a, b), Math.max(a, b)];
  } else if ((m = text.match(/^(?:lifetime|life)\s+is\s+(\d+(?:\.\d+)?)(?:\s*(?:to|-)\s*(\d+(?:\.\d+)?))?/i))) {
    const a = parseFloat(m[1]), b = m[2] ? parseFloat(m[2]) : a;
    spec.lifetime = [Math.min(a, b), Math.max(a, b)];
  } else if ((m = text.match(/^direction\s+is\s+(.+)$/i))) {
    const dirs = { up: 0, right: 90, down: 180, left: 270 };
    const v = m[1].trim().toLowerCase();
    spec.direction = v in dirs ? dirs[v] : parseFloat(v) || 0;
  } else if ((m = text.match(/^spread\s+is\s+(\d+(?:\.\d+)?)/i))) spec.spread = parseFloat(m[1]);
  else if ((m = text.match(/^gravity\s+is\s+(-?\d+(?:\.\d+)?)/i))) spec.gravity = parseFloat(m[1]);
  else if ((m = text.match(/^shape\s+is\s+(.+)$/i))) spec.shape = parseShape(m[1], line);
  else if (/^fade(?:s)?(?:\s+out)?$/i.test(text)) spec.fade = true;
  else if (/^shrink(?:s)?(?:\s+away)?$/i.test(text)) spec.shrink = true;
  else throw new CrimError(`Line ${line}: Unknown particle detail '${text}'.`, line);
}

function parseDetail(text, line, spec) {
  const [head, ...mods] = text.split("|").map(s => s.trim());
  const pf = head.match(/^position\s+from\s+(?:the\s+)?(left|right|top|bottom)\s+(?:is|are)\s+(.+)$/i);
  if (pf) {
    applyPositionParts(spec, [[pf[1].toLowerCase(), parseOperand(pf[2].replace(/\s*(?:pixels?|px)$/i, "").trim(), line)]], line);
    return;
  }
  const m = head.match(/^(\w+)\s+(is|says|are)\s+(.+)$/i);
  if (!m) throw new CrimError(`Line ${line}: Invalid detail '${text}'.`, line);
  const key = m[1].toLowerCase(), val = m[3].trim();

  if (spec.kind === "character") {
    if (val.startsWith('"') && val.endsWith('"')) spec[key] = unquote(val);
    else { const n = toNumber(val); spec[key] = n !== null ? n : val; }
    return;
  }
  if (key === "items") {
    spec.items = val.replace(/^\[|\]$/g, "").split(",").map(x => x.trim()).filter(Boolean).map(x => toNumber(x) ?? unquote(x));
    return;
  }
  if (key === "text") {
    spec.text = val.toLowerCase() === "time"
      ? ["time", { milliseconds: mods.some(md => /milliseconds/i.test(md)) }]
      : ["expr", splitJoined(val, line).map(p => parseOperand(p, line))];
    return;
  }
  if (key === "color") {
    spec.color = unquote(val);
    resolveColor(spec.color, line);
    for (const mod of mods) {
      const om = mod.match(/opacity\s+(?:being|is)\s+(\d+(?:\.\d+)?)\s*%/i);
      if (om) spec.opacity = parseFloat(om[1]) / 100;
    }
    return;
  }
  if (spec.kind === "sound") {
    if (key === "sound") spec.sound = unquote(val);
    else if (key === "volume") spec.volume = parseFloat(val) / 100;
    else if (key === "speed" || key === "pitch") spec[key] = parseFloat(val);
    return;
  }
  if (key === "position") {
    if (/\bfrom\b/i.test(val)) {
      const parts = splitArgs(val).map(piece => {
        const pm = piece.match(/^(?:at\s+)?(.+?)\s*(?:pixels?|px)?\s+from\s+(?:the\s+)?(left|right|top|bottom)$/i);
        if (!pm) throw new CrimError(`Line ${line}: Invalid position '${val}'.`, line);
        return [pm[2].toLowerCase(), parseOperand(pm[1], line)];
      });
      applyPositionParts(spec, parts, line);
    } else {
      let place = val.toLowerCase().replace(/^at\s+/, "").replace(/-/g, " ").replace(/\s+corner$/, "").trim();
      if (!POSITIONS[place]) throw new CrimError(`Line ${line}: Unknown position '${val}'.`, line);
      spec.anchor = { h: "center", v: "center" };
      if (place.includes("left")) spec.anchor.h = "left";
      if (place.includes("right")) spec.anchor.h = "right";
      if (place.includes("top")) spec.anchor.v = "top";
      if (place.includes("bottom")) spec.anchor.v = "bottom";
      spec.pos_expr = {}; spec.dx = 0; spec.dy = 0; spec.position = place;
    }
  } else if (key === "opacity") spec.opacity = parseFloat(val.replace("%", "")) / 100;
  else if (key === "rotation") spec.rotation = parseFloat(val.replace(/degrees?/i, "")) % 360;
  else if (key === "font") spec.font = unquote(val);
  else if (key === "size") spec.size = parseInt(val, 10);
  else if (["width", "height", "rows", "columns", "gap"].includes(key)) spec[key] = parseInt(val, 10);
  else if (key === "picture") spec.picture = unquote(val);
  else if (key === "shape") spec.shape = parseShape(val, line);
  else throw new CrimError(`Line ${line}: '${spec.kind}' doesn't support '${key}'.`, line);
}

function applyPositionParts(spec, parts, line) {
  for (const [side, node] of parts) {
    const horiz = side === "left" || side === "right";
    const axis = horiz ? "dx" : "dy";
    spec.anchor[horiz ? "h" : "v"] = side;
    const sign = (side === "left" || side === "top") ? 1 : -1;
    delete spec.pos_expr[axis];
    if (node[0] === "num") spec[axis] = sign * node[1];
    else { spec[axis] = 0; spec.pos_expr[axis] = [sign, node, line]; }
  }
  const words = [];
  if (spec.anchor.v !== "center") words.push(spec.anchor.v);
  if (spec.anchor.h !== "center") words.push(spec.anchor.h);
  spec.position = words.join(" ") || "center";
}

function parseAnchor(text, line) {
  const t = text.trim();
  if (POSITIONS[t.toLowerCase()]) return ["place", t.toLowerCase()];
  if (/^(?:that\s+)?[A-Za-z_]\w*$/.test(t)) return ["target", parseTarget(t, line)];
  const pieces = splitArgs(t);
  if (pieces.length === 2) return ["xy", parseOperand(pieces[0], line), parseOperand(pieces[1], line)];
  throw new CrimError(`Line ${line}: Unknown position '${text}'.`, line);
}

function parseStatement(lines, pos) {
  const { text, number } = lines[pos];
  let m;

  if (/^if\s+/i.test(text)) {
    const startLine = number, clauses = [];
    while (pos < lines.length) {
      const cur = lines[pos];
      if (/^anything else/i.test(cur.text)) {
        const blk = parseBlock(lines, pos + 1, { kind: "if", line: startLine });
        clauses.push([null, blk.stmts, cur.number]);
        pos = expectEnd(lines, blk.pos, "if", startLine);
        break;
      }
      const im = cur.text.match(/^(?:but )?if\s+(.+?)\s*,?\s*then do:?$/i);
      if (!im) throw new CrimError(`Line ${cur.number}: Invalid 'if' syntax.`, cur.number);
      const blk = parseBlock(lines, pos + 1, { kind: "if", line: startLine });
      clauses.push([parseCondition(im[1], cur.number), blk.stmts, cur.number]);
      pos = blk.pos;
      if (pos < lines.length && /^end\s+if$/i.test(lines[pos].text)) {
        pos = expectEnd(lines, pos, "if", startLine);
        break;
      }
    }
    return { stmt: ["chain", clauses, startLine], pos };
  }

  if ((m = text.match(/^for each\s+(\w+)\s+in\s+(.+?)\s*,?\s*do:?$/i))) {
    const blk = parseBlock(lines, pos + 1, { kind: "for each", line: number });
    return { stmt: ["for_each", m[1], m[2].trim(), blk.stmts, number], pos: expectEnd(lines, blk.pos, "for each", number) };
  }

  if ((m = text.match(/^(?:this script uses:\s*|use\s+)(\w+)$/i))) {
    const mod = m[1].toLowerCase();
    if (!MODULES.has(mod)) throw new CrimError(`Line ${number}: Unknown module '${m[1]}'.`, number);
    return { stmt: ["uses", mod, number], pos: pos + 1 };
  }

  if (/^open display$/i.test(text)) return { stmt: ["open_display", number], pos: pos + 1 };

  if ((m = text.match(/^display\s+(width|height|background)\s+is\s+(.+)$/i))) {
    const key = m[1].toLowerCase();
    let val = m[2].trim();
    if (key === "background") {
      val = unquote(val);
      if (/\.(png|jpg|jpeg|gif|webp|bmp)$/i.test(val)) return { stmt: ["window", "background_image", val, number], pos: pos + 1 };
      resolveColor(val, number);
    } else {
      val = parseInt(val.replace(/pixels?|px/gi, ""), 10);
      if (!val || val <= 0) throw new CrimError(`Line ${number}: Display ${key} must be positive.`, number);
    }
    return { stmt: ["window", key, val, number], pos: pos + 1 };
  }

  if ((m = text.match(/^display\s+(\w+)$/i))) return { stmt: ["show", m[1], number], pos: pos + 1 };

  if ((m = text.match(/^(\w+)\s+is\s+(text|image|shape|list|grid|character|sound|particles|tile)\s*,\s*details are\s*:?$/i))) {
    return parseElement(lines, pos, m[1], m[2].toLowerCase(), number);
  }

  if ((m = text.match(/^when\s+the\s+(display|tilemap)\s+is\s+(?:(left|right|middle)\s+)?clicked\s*,?\s*do:?$/i))) {
    const blk = parseBlock(lines, pos + 1, { kind: "when", line: number });
    return { stmt: ["when_click", m[1].toLowerCase(), (m[2] || "left").toLowerCase(), blk.stmts, number], pos: expectEnd(lines, blk.pos, "when", number) };
  }

  if ((m = text.match(/^when\s+(.+?)\s+is\s+(pressed|held)\s*,?\s*do:?$/i))) {
    const blk = parseBlock(lines, pos + 1, { kind: "when", line: number });
    return { stmt: ["when_key", parseKeyCondition(m[1], m[2].toLowerCase()), m[2].toLowerCase(), blk.stmts, number], pos: expectEnd(lines, blk.pos, "when", number) };
  }

  if ((m = text.match(/^when\s+(\w+)\s+touches\s+(\w+)\s*,?\s*do:?$/i))) {
    const blk = parseBlock(lines, pos + 1, { kind: "when", line: number });
    return { stmt: ["when_touch", m[1], m[2], blk.stmts, number], pos: expectEnd(lines, blk.pos, "when", number) };
  }

  if ((m = text.match(/^set\s+(\w+)\s+of\s+((?:that\s+)?\w+)\s+to\s+(.+)$/i))) {
    const prop = m[1].toLowerCase(), target = parseTarget(m[2], number), valRaw = m[3].trim();
    if (["x", "y"].includes(prop)) return { stmt: ["set_pos", target, prop, parseOperand(valRaw, number), number], pos: pos + 1 };
    if (prop === "color") { const c = unquote(valRaw); resolveColor(c, number); return { stmt: ["set_color", target, c, number], pos: pos + 1 }; }
    if (prop === "shape") return { stmt: ["set_shape", target, parseShape(unquote(valRaw), number), number], pos: pos + 1 };
    if (prop === "rotation") return { stmt: ["set_rotation", target, parseOperand(valRaw.replace(/degrees?/i, ""), number), number], pos: pos + 1 };
    if (["width", "height"].includes(prop)) return { stmt: ["set_size", target, prop, parseOperand(valRaw.replace(/pixels?|px/gi, ""), number), number], pos: pos + 1 };
    if (prop === "opacity") return { stmt: ["set_opacity", target, parseOperand(valRaw.replace("%", ""), number), number], pos: pos + 1 };
    throw new CrimError(`Line ${number}: Cannot set '${prop}'.`, number);
  }

  if ((m = text.match(/^(move|slide)\s+((?:that\s+)?\w+)\s+(.+?)\s+(in|over)\s+(.+?)\s*seconds?(?:(?:\s*,\s*|\s+with\s+)(?:with\s+)?([A-Za-z][A-Za-z ]*?))?$/i))) {
    const verb = m[1].toLowerCase(), target = parseTarget(m[2], number), what = m[3].trim();
    const durNode = parseOperand(m[5], number), style = (m[6] || "linear").trim().toLowerCase();
    if (!EASINGS[style]) throw new CrimError(`Line ${number}: Unknown easing '${style}'.`, number);
    const changes = [];
    if (verb === "move") {
      for (const part of what.split(/\s+and\s+/i)) {
        const pm = part.trim().match(/^(left|right|up|down)\s+(.+?)(?:\s+pixels?)?$/i);
        if (!pm) throw new CrimError(`Line ${number}: Invalid move tween.`, number);
        const dir = pm[1].toLowerCase();
        changes.push([dir === "left" || dir === "right" ? "dx" : "dy", "by", parseOperand(pm[2], number), dir]);
      }
    } else {
      for (const part of what.replace(/^to\s+/i, "").split(/\s+and\s+/i)) {
        const pm = part.trim().match(/^(x|y|opacity|rotation)\s+(.+?)(?:\s*(?:pixels?|px|degrees?|%))?$/i);
        if (!pm) throw new CrimError(`Line ${number}: Invalid slide tween.`, number);
        const name = pm[1].toLowerCase();
        changes.push([name === "x" ? "dx" : name === "y" ? "dy" : name, "to", parseOperand(pm[2], number), name]);
      }
    }
    return { stmt: ["tween", target, changes, durNode, style, number], pos: pos + 1 };
  }

  if ((m = text.match(/^move\s+((?:that\s+)?\w+)\s+(left|right|up|down)\s+(.+?)(?:\s+pixels?)?$/i))) {

  }

  if ((m = text.match(/^change\s+(?:(\w+)\s+of\s+)?(\w+)(?:\[(.+?)\])?\s+by\s+(.+)$/i))) {
    return { stmt: ["change", m[2], m[1] || null, m[3] ? parseOperand(m[3], number) : null, parseOperand(m[4], number), number], pos: pos + 1 };
  }

  if ((m = text.match(/^make\s+(.+?)\s+cop(?:y|ies) of\s+(\w+)$/i))) return { stmt: ["make", parseOperand(m[1], number), m[2], number], pos: pos + 1 };

  }

  }

  if ((m = text.match(/^(every|after)\s+(.+?)\s*seconds?\s*,?\s*do:?$/i))) {
    const kind = m[1].toLowerCase();
    const blk = parseBlock(lines, pos + 1, { kind, line: number });

  }

  if ((m = text.match(/^repeat\s+(.+?)(?:\s+times)?\s*:?$/i))) {
    const blk = parseBlock(lines, pos + 1, { kind: "repeat", line: number });

  }
  if ((m = text.match(/^(?:run|perform)\s+(\w+)(?:\s+using\s+(.+))?$/i))) {

  }
  if ((m = text.match(/^give back\s+(.+)$/i))) return { stmt: ["return", parseOperand(m[1], number), number], pos: pos + 1 };
  if (/^stop$/i.test(text)) return { stmt: ["stop", number], pos: pos + 1 };

  // Timing and project-file output are asynchronous/synchronous runtime statements respectively.
  if ((m = text.match(/^wait\s+(.+?)\s+seconds?$/i))) {
    return { stmt: ["wait", parseOperand(m[1], number), number], pos: pos + 1 };
  }
  if ((m = text.match(/^write\s+(.+?)\s+to\s+file\s+(["'])(.*?)\2$/i))) {

  }

  if ((m = text.match(/^set\s+(\w+)(?:\[(.+?)\])?\s+to\s+(.+)$/i))) {
    const idx = m[2] ? parseOperand(m[2], number) : null;

  }

  if ((m = text.match(/^add\s+(.+?)\s+to\s+(\w+)$/i))) return { stmt: ["list_add", m[2], splitJoined(m[1], number).map(p => parseOperand(p, number)), number], pos: pos + 1 };
  if ((m = text.match(/^remove item\s+(.+?)\s+from\s+(\w+)$/i))) return { stmt: ["list_remove_index", m[2], parseOperand(m[1], number), number], pos: pos + 1 };
  if ((m = text.match(/^empty\s+(\w+)$/i))) return { stmt: ["list_empty", m[1], number], pos: pos + 1 };
  if ((m = text.match(/^sort\s+(\w+)$/i))) return { stmt: ["list_sort", m[1], number], pos: pos + 1 };

  if ((m = text.match(/^put\s+(.+?)\s+into\s+a\s+group\s+called\s+"(\w+)"$/i))) return { stmt: ["group_put", m[1].split(",").map(s => s.trim()), m[2], number], pos: pos + 1 };

  if ((m = text.match(/^([A-Za-z_]\w*)\s+with\s+(.+)$/i)) && !STATEMENT_STARTERS.has(m[1].toLowerCase())) {
    return { stmt: ["run", m[1], number, splitArgs(m[2]).map(a => parseOperand(a, number))], pos: pos + 1 };
  }
  if (/^[A-Za-z_]\w*$/.test(text) && !STATEMENT_STARTERS.has(text.toLowerCase())) {

  }

class CrimRuntime {
  constructor(canvas, assets, callbacks) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.assets = assets;
    this.callbacks = callbacks;

    this.env = {};
    this.defs = {};
    this.modules = new Set();
    this.nativeFunctions = createBrowserModuleFunctions(this);
    this.elements = {};
    this.scene = [];
    this.groups = {};
    this.handlers = [];
    this.alwaysBlocks = [];
    this.timers = [];
    this.tweens = [];
    this.particles = [];
    this.emitters = {};
    this.patrolStates = {};
    this.orbitAngles = {};
    this.orbitTargets = {};
    this.stalks = [];
    this.stalkPaths = {};
    this.tilemap = null;
    this.copyCounts = {};
    this.bindings = {};
    this.rects = {};
    this.touching = new Set();

    this.window = { width: 760, height: 320, background: "#111116", background_image: null };
    this.displayOpen = false;
    this.running = false;
    this.rafId = null;
    this.lastTime = 0;

    this.mouse = { x: 0, y: 0 };
    this.keysDown = new Set();
    this.keysPressed = new Set();
    this.imageCache = {};
    this.depth = 0;
    this.aborted = false;
  }

  needModule(mod, line) {
    if (!this.modules.has(mod)) throw new CrimError(`Line ${line}: Needs 'use ${mod}' at the top.`, line);
  }

  resolveAssetImage(filename) {
    if (!filename) return null;
    if (this.imageCache[filename]) return this.imageCache[filename];
    const asset = this.assets[filename];
    if (!asset || asset.type !== "image") return null;
    const img = new Image();
    img.src = asset.dataUrl;
    this.imageCache[filename] = img;
    return img;
  }

  playSoundAsset(filename, opts = {}) {
    const asset = this.assets[filename];
    if (!asset || asset.type !== "audio") {
      this.callbacks.onSay(`[Audio: "${filename}" not uploaded yet]`, null);
      return;
    }
    try {
      const audio = new Audio(asset.dataUrl);
      audio.volume = opts.volume !== undefined ? Math.max(0, Math.min(1, opts.volume)) : 1.0;
      if (opts.speed) audio.playbackRate = opts.speed;
      audio.play().catch(() => {});
    } catch {}
  }

  evalValue(node, line) {
    if (!node) return 0;
    const kind = node[0];
    if (kind === "num" || kind === "text") return node[1];
    if (kind === "var") {
      const name = node[1];
      if (name in this.env) return this.env[name];
      if (name in this.defs) return this.callFunction(name, [], line);
      throw new CrimError(`Line ${line}: '${name}' is not defined yet.`, line);
    }
    if (kind === "prop") {
      const [_, objName, propName] = node;
      const obj = this.env[objName];
      if (obj && typeof obj === "object" && !Array.isArray(obj)) return obj[propName] ?? 0;
      if (objName in this.bindings || objName in this.elements) {
        const item = this.bindings[objName] || this.scene.find(i => i.base === objName);
        const spec = item ? item.spec : this.elements[objName];
        const box = this.computeItemBox(item || { name: objName, spec });
        if (propName === "x" || propName === "left") return box.x;
        if (propName === "y" || propName === "top") return box.y;
        if (propName === "width") return box.w;
        if (propName === "height") return box.h;
        if (propName === "right") return box.x + box.w;
        if (propName === "bottom") return box.y + box.h;
        if (propName === "opacity") return Math.round((spec.opacity ?? 1) * 100);
      }
      throw new CrimError(`Line ${line}: Unknown property '${propName}' of '${objName}'.`, line);
    }
    if (kind === "window_size") return this.window[node[1]];
    if (kind === "mouse") {
      if (node[1] === "x") return Math.round(this.mouse.x);
      if (node[1] === "y") return Math.round(this.mouse.y);
      if (!this.tilemap) throw new CrimError(`Line ${line}: Tilemap not plugged in.`, line);
      return Math.floor((node[1] === "tile_x" ? this.mouse.x : this.mouse.y) / this.tilemap.cell);
    }
    if (kind === "tile_at") {
      if (!this.tilemap) return "";
      const found = this.tilemap.cells.get(`${Math.round(this.evalNumber(node[1], line))},${Math.round(this.evalNumber(node[2], line))}`);
      return found ? found.base : "";
    }
    if (kind === "random_expr") {
      const lo = Math.ceil(this.evalNumber(node[1], line));
      const hi = Math.floor(this.evalNumber(node[2], line));
      return Math.floor(Math.random() * (hi - lo + 1)) + lo;
    }
    if (kind === "agg") {
      let vals = node[2].map(a => this.evalValue(a, line));
      if (vals.length === 1 && Array.isArray(vals[0])) vals = vals[0];
      const nums = vals.map(v => toNumber(v) ?? 0);
      if (!nums.length) return 0;
      if (node[1] === "sum") return nums.reduce((a, b) => a + b, 0);
      if (node[1] === "average") return nums.reduce((a, b) => a + b, 0) / nums.length;
      if (node[1] === "smallest") return Math.min(...nums);
      if (node[1] === "largest") return Math.max(...nums);
    }
    if (kind === "index") {
      const lst = this.env[node[1]];
      if (!Array.isArray(lst)) throw new CrimError(`Line ${line}: '${node[1]}' is not a list.`, line);
      return lst[Math.floor(this.evalNumber(node[2], line))];
    }
    if (kind === "call") return this.callFunction(node[1], node[2].map(a => this.evalValue(a, line)), line);
    if (kind === "textfn") {
      const v = this.evalValue(node[2], line);
      if (node[1] === "length") return Array.isArray(v) ? v.length : showVal(v).length;
      const s = showVal(v);
      if (node[1] === "uppercase") return s.toUpperCase();
      if (node[1] === "lowercase") return s.toLowerCase();
      return s.trim();
    }
    if (kind === "split") {
      const s = showVal(this.evalValue(node[1], line)), sep = showVal(this.evalValue(node[2], line));
      return sep === "" ? [...s] : s.split(sep);
    }
    if (kind === "join") return this.env[node[1]].map(showVal).join(showVal(this.evalValue(node[2], line)));
    if (kind === "random_item") {
      const lst = this.env[node[1]];
      return lst[Math.floor(Math.random() * lst.length)];
    }
    if (kind === "neg") return -this.evalNumber(node[1], line);
    if (kind === "func") {
      const n = this.evalNumber(node[2], line), fn = node[1];

      if (fn === "round") return Math.round(n);
      if (fn === "floor") return Math.floor(n);
      if (fn === "ceil") return Math.ceil(n);
      if (fn === "sqrt") return Math.sqrt(n);
      if (fn === "3rt") return Math.cbrt(n);
      const rad = (n * Math.PI) / 180;

  evalNumber(node, line) {

  evalJoined(parts, line) {

  holds(cond, line) {

    if (kind === "or") return cond[1].some(c => this.holds(c, line));

        if (op === "<") return x < y;
        if (op === ">") return x > y;
        if (op === "=" || op === "is") return x === y;
        if (op === "<=" || op === "<or=") return x <= y;
        if (op === ">=" || op === ">or=") return x >= y;
        if (op === "!=" || op === "isnot") return x !== y;

      return kind === "not contains" ? !found : found;

    if (kind === "letters") return typeof v === "string" && /[a-zA-Z]/.test(v);

  targetSpecs(target, line) {

    if (kind === "that") return [this.bindings[name].spec];
    if (!this.elements[name]) throw new CrimError(`Line ${line}: Unknown thing '${name}'.`, line);
    const items = this.scene.filter(i => i.base === name);

  }

  targetItems(target, line) {
    const [kind, name] = target;
    if (kind === "that") return [this.bindings[name]];
    if (!this.elements[name]) throw new CrimError(`Line ${line}: Unknown thing '${name}'.`, line);
    return this.scene.filter(i => i.base === name);

  checkTouching(a, b, line) {

        const ry = this.rects[y.name] || this.computeItemBox(y);
        if (rx.x <= ry.x + ry.w && ry.x <= rx.x + rx.w && rx.y <= ry.y + ry.h && ry.y <= rx.y + ry.h) return true;
      }

    return false;
  }

  computeItemBox(item) {
    const spec = item.spec;
    let w = 0, h = 0;
    if (spec.kind === "text") {

      h = spec.size;
    } else if (spec.kind === "image") {

      const natH = img && img.complete && img.naturalHeight ? img.naturalHeight : 48;
      w = spec.width || (spec.height ? Math.round(natW * spec.height / natH) : natW);
      h = spec.height || (spec.width ? Math.round(natH * spec.width / natW) : natH);

      h = spec.height || 60;

    const [fx, fy] = POSITIONS[spec.position] || POSITIONS["center"];

  callFunction(name, args, line) {

    let ret = null;
    try { this.runBlockSync(body); }
    catch (e) { if (e instanceof ReturnSignal) ret = e.value; else throw e; }
    finally { params.forEach(p => { if (p in saved) this.env[p] = saved[p]; else delete this.env[p]; }); }
    return ret;
  }

  async runBlock(stmts) {
    for (const stmt of stmts) {
      if (this.aborted) return;
      await this.runStmt(stmt);
    }
  }

  runBlockSync(stmts) {
    for (const stmt of stmts) {
      if (this.aborted) return;
      this.runStmtSync(stmt);
    }
  }

  async runStmt(stmt) {
    const kind = stmt[0];
    if (kind === "say") {
      const [_, parts, wait, storeVar, line, color] = stmt;
      const msg = showVal(this.evalJoined(parts, line));
      if (wait) {
        const ans = await this.callbacks.onAsk(msg);
        if (this.aborted) return;
        const n = toNumber(ans);
        this.env[storeVar] = n !== null ? n : ans;
      } else {
        this.callbacks.onSay(msg, color);
      }
      return;
    }
    if (kind === "wait") {
      await new Promise(r => setTimeout(r, Math.max(0, this.evalNumber(stmt[1], stmt[2]) * 1000)));
      return;
    }
    if (kind === "chain") {
      for (const [cond, body, line] of stmt[1]) {
        if (cond === null || this.holds(cond, line)) { await this.runBlock(body); return; }
      }
      return;
    }
    if (kind === "repeat") {
      const count = Math.floor(this.evalNumber(stmt[1], stmt[3]));
      try { for (let i = 0; i < count; i++) { if (this.aborted) return; await this.runBlock(stmt[2]); } }
      catch (e) { if (!(e instanceof StopSignal)) throw e; }
      return;
    }
    if (kind === "while") {
      let guard = 0;
      try {
        while (this.holds(stmt[1], stmt[3])) {
          if (this.aborted) return;
          if (++guard > 50000) throw new CrimError(`Line ${stmt[3]}: Loop limit reached.`, stmt[3]);
          await this.runBlock(stmt[2]);
        }
      } catch (e) { if (!(e instanceof StopSignal)) throw e; }
      return;
    }
    if (kind === "for_each") {
      const lst = this.env[stmt[2]];
      for (const item of lst) { this.env[stmt[1]] = item; await this.runBlock(stmt[3]); }
      return;
    }
    this.runStmtSync(stmt);
  }

  runStmtSync(stmt) {
    const kind = stmt[0];
    if (kind === "say") {
      this.callbacks.onSay(showVal(this.evalJoined(stmt[1], stmt[4])), stmt[5]);
    } else if (kind === "write_file") {
      const [_, valueNode, filename, line] = stmt;
      if (!this.callbacks.onWriteFile) throw new CrimError(`Line ${line}: File writing is unavailable in this environment.`, line);
      const value = this.evalValue(valueNode, line);
      this.callbacks.onWriteFile(filename, showVal(value), line);
    } else if (kind === "set") {
      const [_, name, idx, parts, line] = stmt;
      const val = this.evalJoined(parts, line);
      if (idx !== null) this.env[name][Math.floor(this.evalNumber(idx, line))] = val;
      else this.env[name] = val;
    } else if (kind === "change") {
      const [_, name, prop, idx, amtNode, line] = stmt;
      const delta = this.evalNumber(amtNode, line);
      if (prop) this.env[name][prop] = (toNumber(this.env[name][prop]) || 0) + delta;
      else if (idx !== null) this.env[name][Math.floor(this.evalNumber(idx, line))] += delta;
      else this.env[name] = (toNumber(this.env[name]) || 0) + delta;
    } else if (kind === "chain") {
      for (const [cond, body, line] of stmt[1]) {
        if (cond === null || this.holds(cond, line)) { this.runBlockSync(body); return; }
      }
    } else if (kind === "repeat") {
      const count = Math.floor(this.evalNumber(stmt[1], stmt[3]));
      try { for (let i = 0; i < count; i++) this.runBlockSync(stmt[2]); }
      catch (e) { if (!(e instanceof StopSignal)) throw e; }
    } else if (kind === "while") {
      let guard = 0;
      try {
        while (this.holds(stmt[1], stmt[3])) {
          if (++guard > 50000) throw new CrimError(`Line ${stmt[3]}: Loop limit reached.`, stmt[3]);
          this.runBlockSync(stmt[2]);
        }
      } catch (e) { if (!(e instanceof StopSignal)) throw e; }
    } else if (kind === "uses") {
      this.modules.add(stmt[1]);
    } else if (kind === "open_display") {
      this.needModule("display", stmt[1]);
      this.displayOpen = true;
      this.resizeCanvas();
    } else if (kind === "window") {
      this.needModule("display", stmt[3]);
      this.window[stmt[1]] = stmt[2];
      if (stmt[1] === "background") this.window.background_image = null;
      this.resizeCanvas();
    } else if (kind === "element") {
      const [_, name, spec, elemKind] = stmt;
      if (elemKind === "list") this.env[name] = [...spec.items];
      else if (elemKind === "character") this.env[name] = { ...spec };
      else this.elements[name] = spec;
    } else if (kind === "show") {
      const [_, name, line] = stmt;
      this.needModule("display", line);
      if (!this.displayOpen) throw new CrimError(`Line ${line}: Put 'open display' before 'display ${name}'.`, line);
      if (this.elements[name]) this.displayElement(name, line);
      else if (this.groups[name]) for (const m of this.groups[name]) this.displayElement(m, line);
      else throw new CrimError(`Line ${line}: Unknown thing '${name}'.`, line);
    } else if (kind === "move") {
      const [_, target, dir, amtNode, line] = stmt;
      const amt = this.evalNumber(amtNode, line);
      for (const spec of this.targetSpecs(target, line)) {
        if (dir === "right") spec.dx += amt;
        else if (dir === "left") spec.dx -= amt;
        else if (dir === "down") spec.dy += amt;
        else if (dir === "up") spec.dy -= amt;
      }
    } else if (kind === "set_pos") {
      const [_, target, axis, valNode, line] = stmt;
      const val = this.evalNumber(valNode, line);
      for (const item of this.targetItems(target, line)) {
        const box = this.computeItemBox(item);
        if (axis === "x") item.spec.dx = val - box.bx;
        else item.spec.dy = val - box.by;
      }
    } else if (kind === "set_size") {
      const val = Math.round(this.evalNumber(stmt[3], stmt[4]));
      for (const spec of this.targetSpecs(stmt[1], stmt[4])) spec[stmt[2]] = Math.max(0, val);
    } else if (kind === "set_color") {
      for (const spec of this.targetSpecs(stmt[1], stmt[3])) spec.color = stmt[2];
    } else if (kind === "set_shape") {
      for (const spec of this.targetSpecs(stmt[1], stmt[3])) spec.shape = stmt[2];
    } else if (kind === "set_opacity") {
      const pct = this.evalNumber(stmt[2], stmt[3]);
      for (const spec of this.targetSpecs(stmt[1], stmt[3])) spec.opacity = Math.max(0, Math.min(100, pct)) / 100;
    } else if (kind === "set_rotation") {
      const deg = this.evalNumber(stmt[2], stmt[3]) % 360;
      for (const spec of this.targetSpecs(stmt[1], stmt[3])) spec.rotation = deg;
    } else if (kind === "tween") {
      const [_, target, changes, durNode, style, line] = stmt;
      const dur = this.evalNumber(durNode, line), ease = EASINGS[style];
      for (const item of this.targetItems(target, line)) {
        const box = this.computeItemBox(item);
        for (const [key, mode, node, shown] of changes) {
          const val = this.evalNumber(node, line);
          let start = item.spec[key] || 0, end = val;
          if (key === "dx" || key === "dy") {
            end = mode === "by" ? start + ((shown === "right" || shown === "down") ? val : -val) : val - (key === "dx" ? box.bx : box.by);
          } else if (key === "opacity") end = val / 100;
          this.tweens = this.tweens.filter(t => !(t.spec === item.spec && t.key === key));
          this.tweens.push({ spec: item.spec, key, start, end, time: 0, duration: dur, ease });
        }
      }
    } else if (kind === "make") {
      const count = Math.floor(this.evalNumber(stmt[1], stmt[3])), name = stmt[2];
      for (let i = 0; i < count; i++) {
        this.copyCounts[name] = (this.copyCounts[name] || 0) + 1;
        this.scene.push({ name: `${name}#${this.copyCounts[name]}`, base: name, spec: JSON.parse(JSON.stringify(this.elements[name])) });
      }
    } else if (kind === "play") {
      this.needModule("sound", stmt[2]);
      const file = stmt[1];
      if (this.elements[file] && this.elements[file].kind === "sound") this.playSoundAsset(this.elements[file].sound, this.elements[file]);
      else this.playSoundAsset(file);
    } else if (kind === "always") this.alwaysBlocks.push(stmt[1]);
    else if (kind === "when_key") this.handlers.push({ type: "key", cond: stmt[1], mode: stmt[2], body: stmt[3], line: stmt[4] });
    else if (kind === "when_touch") this.handlers.push({ type: "touch", a: stmt[1], b: stmt[2], body: stmt[3], line: stmt[4] });
    else if (kind === "when_click") this.handlers.push({ type: "click", target: stmt[1], button: stmt[2], body: stmt[3], line: stmt[4] });
    else if (kind === "timer") this.timers.push({ kind: stmt[1], node: stmt[2], body: stmt[3], line: stmt[4], elapsed: 0, done: false });
    else if (kind === "define") this.defs[stmt[1]] = [stmt[2], stmt[3]];
    else if (kind === "run") this.callFunction(stmt[1], stmt[3].map(a => this.evalValue(a, stmt[2])), stmt[2]);
    else if (kind === "return") throw new ReturnSignal(this.evalValue(stmt[1], stmt[2]));
    else if (kind === "stop") throw new StopSignal(stmt[1]);
    else if (kind === "patrol") this.patrolStates[stmt[1]] = { dir: stmt[2], dirs: [stmt[2], stmt[3]], timer: 0 };
    else if (kind === "orbit") { this.orbitAngles[stmt[1]] = 0; this.orbitTargets[stmt[1]] = stmt[2]; }
    else if (kind === "stalk") this.stalks.push([stmt[1], stmt[2], stmt[3]]);
    else if (kind === "burst") {
      const spec = this.elements[stmt[1]];
      if (!spec || spec.kind !== "particles") throw new CrimError(`Line ${stmt[3]}: '${stmt[1]}' is not particles.`, stmt[3]);
      const pt = this.resolveAnchorPoint(stmt[2], stmt[3]);
      this.spawnParticles(spec, pt.x, pt.y, spec.amount);
    } else if (kind === "stream") {
      this.emitters[stmt[1]] = { anchor: stmt[2], line: stmt[3], carry: 0 };
    } else if (kind === "stop_particles") delete this.emitters[stmt[1]];
    else if (kind === "plug") {
      this.needModule("tilemap", stmt[2]);
      this.tilemap = { cell: stmt[1] ? this.evalNumber(stmt[1], stmt[2]) : 32, cells: new Map() };
    } else if (kind === "place_tile") {
      const [_, name, x1n, y1n, x2n, y2n, line] = stmt;
      const tile = this.elements[name];
      const x1 = Math.round(this.evalNumber(x1n, line)), x2 = Math.round(this.evalNumber(x2n, line));
      const y1 = Math.round(this.evalNumber(y1n, line)), y2 = Math.round(this.evalNumber(y2n, line));
      const cell = this.tilemap.cell;
      for (let cy = Math.min(y1, y2); cy <= Math.max(y1, y2); cy++) {
        for (let cx = Math.min(x1, x2); cx <= Math.max(x1, x2); cx++) {
          const key = `${cx},${cy}`;
          const old = this.tilemap.cells.get(key);
          if (old) this.scene = this.scene.filter(i => i !== old);
          const spec = {
            kind: tile.texture ? "image" : "shape", picture: tile.texture, shape: ["polygon", 4],
            color: tile.color || "white", position: "top left", opacity: 1,
            dx: cx * cell, dy: cy * cell, width: Math.round(tile.w * cell), height: Math.round(tile.h * cell), free: true
          };
          this.copyCounts[name] = (this.copyCounts[name] || 0) + 1;
          const item = { name: `${name}#${this.copyCounts[name]}`, base: name, spec };
          this.scene.unshift(item);
          this.tilemap.cells.set(key, item);
        }
      }
    } else if (kind === "remove_tile") {
      const key = `${Math.round(this.evalNumber(stmt[1], stmt[3]))},${Math.round(this.evalNumber(stmt[2], stmt[3]))}`;
      const old = this.tilemap?.cells.get(key);
      if (old) { this.scene = this.scene.filter(i => i !== old); this.tilemap.cells.delete(key); }
    } else if (kind === "list_add") this.env[stmt[1]].push(this.evalJoined(stmt[2], stmt[3]));
    else if (kind === "list_remove_index") this.env[stmt[1]].splice(Math.floor(this.evalNumber(stmt[2], stmt[3])), 1);
    else if (kind === "list_empty") this.env[stmt[1]].length = 0;
    else if (kind === "list_sort") this.env[stmt[1]].sort((a, b) => showVal(a).localeCompare(showVal(b)));
    else if (kind === "group_put") this.groups[stmt[2]] = stmt[1];
    else if (kind === "group_hide") { for (const m of (this.groups[stmt[1]] || [])) if (this.elements[m]) this.elements[m].opacity = 0; }
    else if (kind === "group_show") { for (const m of (this.groups[stmt[1]] || [])) if (this.elements[m]) this.elements[m].opacity = 1; }
  }

  displayElement(name, line) {
    const spec = this.elements[name];
    if (!spec) throw new CrimError(`Line ${line}: Unknown element '${name}'.`, line);
    if (spec.kind === "grid") {
      const totalW = spec.columns * spec.width + (spec.columns - 1) * spec.gap;
      const totalH = spec.rows * spec.height + (spec.rows - 1) * spec.gap;
      const startX = Math.floor((this.window.width - totalW) / 2);
      const startY = Math.floor((this.window.height - totalH) / 2);
      for (let r = 0; r < spec.rows; r++) {
        for (let c = 0; c < spec.columns; c++) {
          this.scene.push({
            name: `${name}_${r}_${c}`, base: name,
            spec: {
              kind: "shape", shape: spec.shape, width: spec.width, height: spec.height,
              color: spec.color, position: "top left", opacity: spec.opacity,
              dx: startX + c * (spec.width + spec.gap), dy: startY + r * (spec.height + spec.gap),
              on_click: spec.on_click, rotation: spec.rotation || 0
            }
          });
        }
      }
      return;
    }
    if (spec.kind !== "sound" && !this.scene.some(i => i.name === name)) this.scene.push({ name, base: name, spec });
  }

  resolveAnchorPoint(anchor, line) {
    if (anchor[0] === "xy") return { x: this.evalNumber(anchor[1], line), y: this.evalNumber(anchor[2], line) };
    if (anchor[0] === "place") {
      const [fx, fy] = POSITIONS[anchor[1]];
      return { x: fx * this.window.width, y: fy * this.window.height };
    }
    const items = this.targetItems(anchor[1], line);
    if (!items.length) return { x: this.window.width / 2, y: this.window.height / 2 };
    const box = this.rects[items[0].name] || this.computeItemBox(items[0]);
    return { x: box.x + box.w / 2, y: box.y + box.h / 2 };
  }

  spawnParticles(spec, x, y, count) {
    for (let i = 0; i < count && this.particles.length < 3000; i++) {
      const angle = ((spec.direction + (Math.random() - 0.5) * spec.spread) * Math.PI) / 180;
      const spd = spec.speed[0] + Math.random() * (spec.speed[1] - spec.speed[0]);
      const life = spec.lifetime[0] + Math.random() * (spec.lifetime[1] - spec.lifetime[0]);
      const size = spec.size[0] + Math.random() * (spec.size[1] - spec.size[0]);
      const color = spec.colors[Math.floor(Math.random() * spec.colors.length)];
      this.particles.push({
        x, y, vx: Math.sin(angle) * spd, vy: -Math.cos(angle) * spd,
        age: 0, life, size, color, gravity: spec.gravity, fade: spec.fade, shrink: spec.shrink
      });
    }
  }

  resizeCanvas() {
    if (this.canvas.width !== this.window.width || this.canvas.height !== this.window.height) {
      this.canvas.width = this.window.width;
      this.canvas.height = this.window.height;
    }
  }

  keyHolds(cond) {
    if (cond[0] === "key") return cond[2] === "pressed" ? this.keysPressed.has(cond[1]) : this.keysDown.has(cond[1]);
    if (cond[0] === "or") return cond[1].some(c => this.keyHolds(c));
    return cond[1].every(c => this.keyHolds(c));
  }

  stepFrame(dt) {
    for (const h of this.handlers) if (h.type === "key" && this.keyHolds(h.cond)) this.runBlockSync(h.body);
    this.keysPressed.clear();

    for (const blk of this.alwaysBlocks) this.runBlockSync(blk);

    for (const [name, st] of Object.entries(this.patrolStates)) {
      if (++st.timer > 120) { st.timer = 0; st.dir = st.dir === st.dirs[0] ? st.dirs[1] : st.dirs[0]; }
      for (const item of this.scene.filter(i => i.base === name)) {
        if (st.dir === "right") item.spec.dx += 3;
        else if (st.dir === "left") item.spec.dx -= 3;
        else if (st.dir === "down") item.spec.dy += 3;
        else if (st.dir === "up") item.spec.dy -= 3;
      }
    }

    for (const [aName, angle] of Object.entries(this.orbitAngles)) {
      const nextAngle = (angle + 2) % 360;
      this.orbitAngles[aName] = nextAngle;
      const rad = (nextAngle * Math.PI) / 180;
      const targetItem = this.scene.find(i => i.base === this.orbitTargets[aName]);
      if (!targetItem) continue;
      const rb = this.rects[targetItem.name] || this.computeItemBox(targetItem);
      for (const item of this.scene.filter(i => i.base === aName)) {
        const ra = this.rects[item.name] || this.computeItemBox(item);
        item.spec.dx = Math.round(rb.x + rb.w / 2 + Math.cos(rad) * 110 - ra.w / 2 - ra.bx);
        item.spec.dy = Math.round(rb.y + rb.h / 2 + Math.sin(rad) * 110 - ra.h / 2 - ra.by);
      }
    }

    for (const [aName, bName, delay] of this.stalks) {
      const bItem = this.scene.find(i => i.base === bName);
      if (!bItem) continue;
      const key = `${aName}|${bName}`;
      if (!this.stalkPaths[key]) this.stalkPaths[key] = [];
      this.stalkPaths[key].push([bItem.spec.dx, bItem.spec.dy]);
      if (this.stalkPaths[key].length > 600) this.stalkPaths[key].shift();
      const pt = this.stalkPaths[key][Math.max(0, this.stalkPaths[key].length - 1 - Math.max(0, Math.round(delay * 60)))];
      if (pt) for (const item of this.scene.filter(i => i.base === aName)) { item.spec.dx = pt[0]; item.spec.dy = pt[1]; }
    }

    for (const t of this.timers) {
      if (t.done) continue;
      t.elapsed += dt;
      if (t.elapsed >= this.evalNumber(t.node, t.line)) {
        if (t.kind === "every") t.elapsed = 0; else t.done = true;
        this.runBlockSync(t.body);
      }
    }

    this.tweens = this.tweens.filter(tw => {
      tw.time += dt;
      const done = tw.time >= tw.duration;
      tw.spec[tw.key] = tw.start + (tw.end - tw.start) * (done ? 1 : tw.ease(tw.time / tw.duration));
      return !done;
    });

    for (const [name, em] of Object.entries(this.emitters)) {
      const spec = this.elements[name];
      if (!spec) continue;
      const pt = this.resolveAnchorPoint(em.anchor, em.line);
      em.carry += spec.rate * dt;
      const count = Math.floor(em.carry);
      em.carry -= count;
      if (count > 0) this.spawnParticles(spec, pt.x, pt.y, count);
    }

    this.particles = this.particles.filter(p => {
      p.age += dt;
      if (p.age >= p.life) return false;
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      return true;
    });

    for (const item of this.scene) {
      if (!item.spec.pos_expr) continue;
      for (const [axis, [sign, node, line]] of Object.entries(item.spec.pos_expr)) {
        item.spec[axis] = sign * this.evalNumber(node, line);
      }
    }

    this.render();

    const currentTouches = new Set();
    for (let idx = 0; idx < this.handlers.length; idx++) {
      const h = this.handlers[idx];
      if (h.type !== "touch") continue;
      for (const a of this.scene.filter(x => x.base === h.a)) {
        for (const b of this.scene.filter(x => x.base === h.b)) {
          if (a === b) continue;
          const ra = this.rects[a.name], rb = this.rects[b.name];
          if (ra && rb && ra.x <= rb.x + rb.w && rb.x <= ra.x + ra.w && ra.y <= rb.y + rb.h && rb.y <= ra.y + ra.h) {
            currentTouches.add(`${idx}|${a.name}|${b.name}`);
          }
        }
      }
    }
    for (const key of currentTouches) {
      if (!this.touching.has(key)) {
        const [idxStr, aName, bName] = key.split("|");
        const h = this.handlers[parseInt(idxStr, 10)];
        const prev = this.bindings;
        this.bindings = { [h.a]: this.scene.find(x => x.name === aName), [h.b]: this.scene.find(x => x.name === bName) };
        try { this.runBlockSync(h.body); } finally { this.bindings = prev; }
      }
    }
    this.touching = currentTouches;
  }

  render() {
    const ctx = this.ctx, W = this.window.width, H = this.window.height;
    ctx.save();
    ctx.globalAlpha = 1;
    if (this.window.background_image) {
      const bgImg = this.resolveAssetImage(this.window.background_image);
      if (bgImg && bgImg.complete && bgImg.naturalWidth) ctx.drawImage(bgImg, 0, 0, W, H);
      else { ctx.fillStyle = "#111116"; ctx.fillRect(0, 0, W, H); }
    } else {
      ctx.fillStyle = rgbToCss(resolveColor(this.window.background, 1), 1);
      ctx.fillRect(0, 0, W, H);
    }

    this.rects = {};
    for (const item of this.scene) {
      const spec = item.spec, alpha = spec.opacity ?? 1.0;
      const box = this.computeItemBox(item);
      if (!spec.free) { spec.dx = box.x - box.bx; spec.dy = box.y - box.by; }
      this.rects[item.name] = box;
      if (alpha <= 0) continue;

      ctx.save();
      ctx.globalAlpha = alpha;
      const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
      if (spec.rotation) {
        ctx.translate(cx, cy);
        ctx.rotate((spec.rotation * Math.PI) / 180);
        ctx.translate(-cx, -cy);
      }

      if (spec.kind === "shape") {
        ctx.fillStyle = rgbToCss(resolveColor(spec.color || "white", 1), 1);
        const [shapeType, sides] = spec.shape || ["polygon", 4];
        if (shapeType === "circle") {
          ctx.beginPath();
          ctx.ellipse(cx, cy, Math.max(1, box.w / 2), Math.max(1, box.h / 2), 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (sides === 4) {
          ctx.fillRect(box.x, box.y, box.w, box.h);
        } else {
          const pts = [];
          for (let i = 0; i < sides; i++) {
            const ang = -Math.PI / 2 + (2 * Math.PI * i) / sides;
            pts.push([Math.cos(ang), Math.sin(ang)]);
          }

function cleanProjectFilename(value, fallback="untitled.txt") {
